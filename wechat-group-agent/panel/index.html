<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>微信机器人控制台</title>
<style>
  /* ── GitHub 式层次：灰底 + 白卡片 + 蓝强调（不刺眼、不疲劳）── */
  #wx-panel{
    --bg:#F6F7F9;          /* 浅灰底，眼睛有落点 */
    --bg-deep:#EEF0F3;     /* 更深的底（表头/hover） */
    --card:#FFFFFF;        /* 白卡片浮起来 */
    --text:#1F2328;
    --muted:#656D76;
    --line:#D8DEE4;
    --line-2:#E9ECF0;
    --accent:#0969DA;      /* GitHub 蓝 */
    --accent-soft:#DDF0FF;
    --ok:#1A7F37;
    --ok-soft:#DAFBE1;
    --warn:#9A6700;
    --warn-soft:#FFF8C5;
    --bad:#CF222E;
    --bad-soft:#FFEBE9;
    --teal:#1B7C83;
    --chip:#F0F2F5;
    --shadow:0 1px 2px rgba(31,35,40,.06);
    --shadow-md:0 3px 12px rgba(31,35,40,.08);
    --radius:6px;
  }
  @media (prefers-color-scheme: dark){
    #wx-panel{
      --bg:#0D1117;        /* GitHub dark 底 */
      --bg-deep:#161B22;
      --card:#161B22;
      --text:#E6EDF3;
      --muted:#8B949E;
      --line:#30363D;
      --line-2:#21262D;
      --accent:#4493F8;
      --accent-soft:#121D2F;
      --ok:#3FB950;
      --ok-soft:#12261A;
      --warn:#D29922;
      --warn-soft:#2A2114;
      --bad:#F85149;
      --bad-soft:#2D1518;
      --teal:#39C5CF;
      --chip:#21262D;
      --shadow:none;
      --shadow-md:0 3px 12px rgba(0,0,0,.4);
    }
  }
  #wx-panel,#wx-panel *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  #wx-panel{height:100%;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;
    background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale}
  /* 独立打开（/wechat-bot）：页面自己当滚动容器。
     嵌进 DSH 原生界面时 body 会被加上 .wx-embed-host —— 这时绝不能改宿主页面的
     body 布局（flex/overflow 会把整个 DSH 界面改坏），只重置背景。 */
  html{height:100%}
  body:not(.wx-embed-host){height:100%;overflow:hidden}

  .wx-panel-root button,.wx-panel-root input,.wx-panel-root select,.wx-panel-root textarea{font:inherit;color:inherit}
  #wx-panel a{color:var(--accent);text-underline-offset:3px}
  #wx-panel a:hover{text-decoration:underline}

  #wx-panel header{position:static;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:0 0 auto;
    padding:0 20px;height:52px;background:var(--card);border-bottom:1px solid var(--line)}
  .brand{font-weight:600;font-size:14px;white-space:nowrap;letter-spacing:-.01em}
  .brand small{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}
  .pills{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    background:var(--chip);font-size:12px;color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
  .pill b{font-weight:500;color:var(--text)}
  /* 状态胶囊：让"开/关/异常"一眼能分（2026-10-27：用户反馈只看文字分不出状态） */
  .pill.ok{background:rgba(22,163,74,.12);border-color:rgba(22,163,74,.35);color:var(--ok)}
  .pill.warn{background:rgba(217,119,6,.12);border-color:rgba(217,119,6,.35);color:var(--warn)}
  .pill.bad{background:rgba(220,38,38,.12);border-color:rgba(220,38,38,.35);color:var(--bad)}
  .small.ok{color:var(--ok)} .small.warn{color:var(--warn)} .small.bad{color:var(--bad)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .hswitch{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}

  #wx-panel .shell{display:flex;flex:1 1 auto;min-height:0}
  /* 侧栏用白底 + 内容区灰底 → 分区清楚 */
  #wx-panel nav{width:200px;flex:0 0 200px;padding:14px 10px;border-right:1px solid var(--line);
    background:var(--card);position:static;height:auto;overflow:auto}
  #wx-panel nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--radius);color:var(--text);
    text-decoration:none;font-size:13.5px;margin-bottom:1px;transition:background .12s,color .12s}
  #wx-panel nav a:hover{background:var(--bg-deep);text-decoration:none}
  #wx-panel nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #wx-panel main{flex:1;min-width:0;width:100%;padding:24px 28px 72px;overflow:auto;min-height:0}

  /* 嵌进 DSH 原生界面（lib/client.js 的 React 容器）时：
     外层高度固定，滚动必须交给我们自己的 flex 布局 */
  .wx-panel-embed{height:100%;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .wx-panel-embed header{position:static;flex:0 0 auto}
  .wx-panel-embed .shell{flex:1 1 auto;min-height:0}
  .wx-panel-embed nav{overflow:auto;height:auto}
  .wx-panel-embed main{overflow:auto;min-height:0}

  .banner{display:none;padding:11px 14px;border-radius:var(--radius);margin-bottom:16px;font-size:13px;
    border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
  .banner.show{display:block}
  .banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,var(--line));color:var(--bad)}
  .banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,var(--line));color:var(--warn)}

  #wx-panel h2{font-size:20px;margin:0 0 18px;font-weight:600;letter-spacing:-.02em}
  #wx-panel h2 .muted{font-weight:400;font-size:13px;letter-spacing:0;color:var(--muted)}
  #wx-panel h3{font-size:13px;margin:22px 0 10px;color:var(--muted);font-weight:500}

  /* 指标卡：白卡浮在灰底上，左侧彩色条 = 一眼分类 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .card .t{font-weight:500;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .card .d{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.55}
  .card .k{font-size:28px;font-weight:600;margin-top:7px;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1.1}
  .card .k .muted{font-size:14px;font-weight:400;letter-spacing:0}

  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .grow{flex:1}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

  /* 按钮：36px、6px 圆角、白底描边；主按钮用蓝（视觉锚点） */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;
    border-radius:var(--radius);border:1px solid var(--line);background:var(--card);
    color:var(--text);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;
    box-shadow:var(--shadow);
    transition:background .12s,border-color .12s,color .12s}
  .btn:hover{background:var(--bg-deep);border-color:color-mix(in srgb,var(--line) 70%,var(--muted))}
  .btn:active{background:var(--bg-deep);box-shadow:inset 0 1px 2px rgba(31,35,40,.10)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow)}
  .btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000);border-color:transparent}
  .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
  .btn.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:none;background:var(--bg-deep)}
  .btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}

  .sw{position:relative;display:inline-block;width:38px;height:21px;flex:0 0 auto;vertical-align:middle}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.16s;cursor:pointer}
  .sw i:before{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;background:#fff;
    border-radius:50%;transition:.16s;box-shadow:0 1px 2px rgba(31,35,40,.25)}
  .sw input:checked+i{background:var(--ok)}
  .sw input:checked+i:before{transform:translateX(17px)}
  .sw input:disabled+i{opacity:.4;cursor:not-allowed}

  .fcard{position:relative}
  .fcard .top{display:flex;align-items:flex-start;gap:10px}
  .fcard .ico{font-size:18px;line-height:1.1}
  .fcard .risk{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--warn-soft);
    border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
  .fcard .risk.critical{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
  .fcard.off{opacity:.6}

  .field{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:10px 20px;padding:11px 0;
    border-bottom:1px solid var(--line-2);align-items:center}
  .field:last-child{border-bottom:0}
  .field .lab{font-size:13.5px;font-weight:500}
  .field .help{grid-column:2;color:var(--muted);font-size:12px;margin-top:-4px;line-height:1.55}
  .field .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  #wx-panel input[type=text],#wx-panel input[type=number],#wx-panel input[type=password],#wx-panel select,#wx-panel textarea{
    height:34px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:0 11px;outline:none;min-width:0;font-size:13.5px;
    box-shadow:inset 0 1px 2px rgba(31,35,40,.04);
    transition:border-color .12s,box-shadow .12s}
  #wx-panel input[type=text]:focus,#wx-panel input[type=number]:focus,#wx-panel input[type=password]:focus,#wx-panel select:focus,#wx-panel textarea:focus{
    border-color:var(--accent);box-shadow:inset 0 1px 2px rgba(31,35,40,.03),0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  #wx-panel input[type=text]::placeholder,#wx-panel textarea::placeholder{color:var(--muted)}
  #wx-panel input[type=range]{accent-color:var(--accent);width:150px}
  #wx-panel textarea{height:auto;min-height:240px;padding:10px 11px;resize:vertical;line-height:1.6;width:100%}
  .field .ctl textarea{flex:1 1 100%;align-self:stretch}
  /* 人设很长，给足空间（用户反馈：原来太小看不清在写什么） */
  #wx-panel textarea[data-k="persona"]{min-height:380px}
  .num{width:96px}
  .unit{color:var(--muted);font-size:12px}

  /* 分组：白卡 + 灰色表头带 */
  .section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:0 18px 14px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
  .section>.hd{display:flex;align-items:center;gap:10px;padding:11px 18px;margin:0 -18px 10px;
    font-weight:600;font-size:13.5px;background:var(--bg-deep);border-bottom:1px solid var(--line)}
  .section>.hd .muted{font-weight:400;font-size:12px;color:var(--muted)}

  details.adv{margin-top:10px;border-top:1px solid var(--line-2);padding-top:8px}
  details.adv summary{cursor:pointer;color:var(--muted);font-size:13px;padding:8px 0}

  .table{width:100%;border-collapse:collapse;font-size:13.5px}
  .table th,.table td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  .table th{background:var(--bg-deep);color:var(--muted);font-weight:500;font-size:12px;
    border-bottom:1px solid var(--line)}
  .table tr:last-child td{border-bottom:0}
  .table tbody tr:hover{background:var(--bg-deep)}

  .feed{max-height:340px;overflow:auto;font-size:13.5px}
  .feed .line{display:flex;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line-2);border-radius:4px}
  .feed .line:hover{background:var(--bg-deep)}
  .feed .time{color:var(--muted);font-size:11.5px;white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
  .feed .who{font-weight:600;white-space:nowrap}
  .feed .txt{word-break:break-word}

  .logbox{background:#0D1117;color:#C9D1D9;border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;height:420px;overflow:auto;font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;
    white-space:pre-wrap;word-break:break-all}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--card);
    padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;opacity:0;pointer-events:none;
    transition:.18s;z-index:99;max-width:80vw;box-shadow:var(--shadow-md)}
  .toast.show{opacity:1}
  .toast.err{background:var(--bad);color:#fff}
  .toast.ok{background:var(--ok);color:#fff}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    background:var(--chip);font-size:12px;border:1px solid var(--line)}
  .empty{color:var(--muted);font-size:13.5px;padding:20px 0;text-align:center;
    border:1px dashed var(--line);border-radius:var(--radius);background:var(--bg-deep)}
  .kbd{font:11px ui-monospace,Menlo,Consolas,monospace;background:var(--chip);border:1px solid var(--line);
    border-radius:4px;padding:2px 5px;color:var(--muted)}
  .skel{color:var(--muted);padding:24px 0;text-align:center}


  @media (max-width: 800px){
    #wx-panel .shell{flex-direction:column;overflow:hidden}
    #wx-panel nav{width:auto;flex:0 0 auto;position:static;border-right:0;border-bottom:1px solid var(--line);
      display:flex;overflow-x:auto;overflow-y:hidden;gap:2px;padding:8px 10px;z-index:15}
    #wx-panel nav a{margin:0;white-space:nowrap;padding:7px 11px}
    #wx-panel main{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 14px 64px}
    #wx-panel .field{grid-template-columns:1fr}
    #wx-panel .field .help{grid-column:1}
    #wx-panel .pills{order:3;flex-basis:100%}
    #wx-panel .card .k{font-size:24px}
    #wx-panel h2{font-size:18px}
    #wx-panel .section>.hd{margin:0 -14px 8px;padding:10px 14px}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body class="wx-standalone">
<div id="ops-banner"></div>
<div id="wx-panel" class="wx-panel-root">
<header>
  <div class="brand">🐟 微信机器人控制台 <small id="ver"></small><small id="panel-url" title="点一下复制" style="cursor:pointer;margin-left:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;opacity:.7"></small></div>
  <div class="pills" id="pills"><span class="pill">加载中…</span></div>
  <label class="hswitch">总开关 <span class="sw"><input type="checkbox" id="m-enabled"><i></i></span></label>
  <label class="hswitch">演练 <span class="sw"><input type="checkbox" id="m-dry"><i></i></span></label>

</header>

<div class="shell">
  <nav id="nav"></nav>
  <main>
    <div id="banner" class="banner"></div>
    <div id="view" class="skel">正在读取机器人状态…</div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const view = $('#view');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const fmtTime = (ts) => { if (!ts) return '—'; const d = new Date(ts); return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
const ago = (ts) => { if (!ts) return '—'; const s = Math.round((Date.now()-ts)/1000); if (s<60) return s+' 秒前'; if (s<3600) return Math.round(s/60)+' 分钟前'; if (s<86400) return Math.round(s/3600)+' 小时前'; return Math.round(s/86400)+' 天前'; };
const fmtMs = (v) => { const n = Number(v)||0; if (n >= 3600000) return (n/3600000).toFixed(n%3600000?1:0)+' 小时'; if (n >= 60000) return (n/60000).toFixed(n%60000?1:0)+' 分钟'; if (n >= 1000) return (n/1000).toFixed(n%1000?1:0)+' 秒'; return n+' ms'; };
const pct = (v) => Math.round((Number(v)||0)*100)+'%';
// token 数字友好化：1234 → 1.2K，1234567 → 1.23M
const fmtTokens = (v) => {
  const n = Number(v) || 0;
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
};

const NAV = [
  {id:'overview', title:'总览', icon:'📊'},
  {id:'features', title:'功能开关', icon:'🎛'},
  {id:'reply', title:'回复节奏', icon:'💬', groups:['reply']},
  {id:'proactive', title:'主动行为', icon:'🌱', groups:['proactive']},
  {id:'style', title:'说话方式', icon:'🗣', groups:['style']},
  {id:'sticker', title:'表情包', icon:'😄', groups:['sticker'], special:'stickers'},
  {id:'senses', title:'感知', icon:'🖼', groups:['vision','link','douyin']},
  {id:'voice', title:'语音', icon:'🎙', groups:['voiceIn','voiceOut'], special:'voice'},
  {id:'memory', title:'记忆', icon:'🧠', groups:['memory'], special:'memory'},
  {id:'identity', title:'群与人', icon:'👥', groups:['identity'], special:'members'},
  {id:'moment', title:'朋友圈', icon:'📸', groups:['moment'], special:'moment'},
  {id:'model', title:'人设模型', icon:'🐟', groups:['model'], special:'model'},
  {id:'diag', title:'诊断', icon:'🔬', special:'diag'},
  {id:'update', title:'更新', icon:'📦', special:'update'},
  {id:'ops', title:'运维日志', icon:'🩺', groups:['health','selfheal','advanced'], special:'ops'},
  {id:'manual', title:'手动操作', icon:'🕹'},
];

const App = {
  S: null,  tab: localStorage.getItem('wb:tab') || 'overview',
  timers: {},
  lastChance: JSON.parse(localStorage.getItem('wb:lastChances') || '{}'),
  bridgeRooms: [],
  members: [],
  memory: null,
  stickers: null,
  logsAuto: false,
  logsTimer: null,
  pending: new Set(),
  providers: null,
  catalog: null,        // 模型目录（provider 列表 + models），「人设模型」页用
  image: null,
};

/* ── HTTP ─────────────────────────────────────────────── */
// API 前缀：面板挂在 DSH 的 webServer 上，固定走 /wechat-bot/api
const API_BASE = '/wechat-bot/api';
async function api(path, opts) {
  const r = await fetch(API_BASE + path, Object.assign({ credentials:'same-origin' }, opts, {
    headers: Object.assign({ 'content-type':'application/json' }, (opts && opts.headers) || {}),
  }));
  const text = await r.text();
  let j; try { j = JSON.parse(text); } catch { throw new Error('响应不是 JSON（HTTP '+r.status+'）'); }
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
/**
 * 发送类操作的成败判定。
 * 不同 op 的返回字段不一样（sendText → rc；sayVoice → ok；sendSticker → rc+stickerId），
 * 以前页面不看结果一律 toast「已执行/已发送」，失败也报成功。
 */
function sendVerdict(op, r) {
  if (!r || typeof r !== 'object') return { ok: false, why: '没有返回结果' };
  if (r.error) return { ok: false, why: String(r.error) };
  if (op === 'sayVoice') return r.ok === true ? { ok: true } : { ok: false, why: '语音合成/发送失败' };
  if (r.rc !== undefined && r.rc !== null) {
    return Number(r.rc) === 0 ? { ok: true } : { ok: false, why: 'rc=' + r.rc };
  }
  if (r.ok === true) return { ok: true };
  return { ok: false, why: '返回里没有 rc/ok：' + JSON.stringify(r).slice(0, 120) };
}

let toastTimer = null;
function toast(msg, kind) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'err' ? 4200 : 2200);
}

async function refresh(opts) {
  opts = opts || {};
  try {
    const [j, u] = await Promise.all([
      api('/state' + (opts.lite ? '?lite=1' : '')),
      api('/action', { method: 'POST', body: JSON.stringify({ op: 'usage' }) }).catch(() => null),
    ]);
    App.S = j;
    if (u && u.result) App.usage = u.result;
    renderHeader();
    renderOpsBanner();   // 每次拿到状态都刷新横幅（白名单缺失/已修复都能立刻反映）
    if (App.tab === 'overview' || !opts.lite) renderActive(opts);
  } catch (e) {
    toast('读取状态失败：' + e.message, 'err');
    if (!App.S) view.innerHTML = '<div class="card">读取状态失败：' + esc(e.message) + '<br><br><button class="btn" onclick="refresh()">重试</button></div>';
  }
}

/* ── 诊断（崩溃 / 数据库 / 磁盘）──────────────────
   为什么单独拉：要连 hook 的三个诊断端点，慢（并发也有 6 秒上限），
   所以只在「诊断」页和总览的崩溃卡需要时才拉，拉完缓存 60 秒。 */
async function loadDiag(force) {
  const now = Date.now();
  if (!force && App.diag && now - (App.diagAt || 0) < 60_000) return App.diag;
  try {
    const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'diag' }) });
    App.diag = (j && j.result) || null;
    App.diagAt = now;
    return App.diag;
  } catch (e) {
    App.diag = { error: e.message };
    App.diagAt = now;
    return App.diag;
  }
}

/** 切页（导航 / 深链 / 页面内跳转都走它） */
function goTab(id) {
  if (!NAV.some(n => n.id === id)) id = 'overview';
  App.tab = id;
  localStorage.setItem('wb:tab', id);
  if (location.hash !== '#' + id) {
    try { history.replaceState(null, '', '#' + id) } catch { location.hash = '#' + id }
  }
  renderNav();
  renderActive({});
}
window.addEventListener('hashchange', () => {
  const id = String(location.hash || '').replace(/^#/, '');
  if (id && id !== App.tab && NAV.some(n => n.id === id)) goTab(id);
});

function renderNav() {
  $('#nav').innerHTML = NAV.map(n =>
    '<a href="#' + n.id + '" data-tab="' + n.id + '" class="' + (App.tab === n.id ? 'on' : '') + '">' + n.icon + ' ' + esc(n.title) + '</a>'
  ).join('');
  $$('#nav a').forEach(a => a.onclick = (e) => {
    e.preventDefault();
    App.tab = a.dataset.tab;
    localStorage.setItem('wb:tab', App.tab);
    renderNav();
    renderActive({});
  });
}

function renderActive(opts) {
  if (!App.S) return;
  const nav = NAV.find(n => n.id === App.tab);
  if (!nav) { App.tab = 'overview'; return renderActive(opts); }
  if (nav.id === 'overview') return renderOverview();
  if (nav.id === 'features') return renderFeatures();
  if (nav.id === 'manual') return renderManual();
  if (nav.id === 'diag') return renderDiag();
  if (nav.id === 'update') return renderUpdate();
  if (nav.groups) {
    // 模型页要先把 DSH 的模型清单拉回来，下拉框才能填上
    if (nav.special === 'model') { void renderModelPage(); return; }
    renderParams(nav);
    if (nav.special === 'stickers') renderStickerExtra();
    if (nav.special === 'memory') renderMemoryExtra();
    if (nav.special === 'members') renderMembersExtra();
    if (nav.special === 'ops') renderOpsExtra();
    if (nav.special === 'voice') renderVoiceExtra();
    if (nav.special === 'moment') renderMomentExtra();
  }
}

    $('#img-url').value = p.apiUrl

      mode: $('#img-mode').value,
      style: $('#img-style').value,

    finally { btn.disabled = false; btn.textContent = '生成一张测试图' }
}

async function runSelfcheck() {
  // 总览页用 #btn-check/#health-list，运维页用 #btn-check2/#health-list2 —— 两套都要动
  const btns = ['#btn-check', '#btn-check2'].map(sel => $(sel)).filter(Boolean);
  btns.forEach(b => { b.disabled = true; b.textContent = '检查中…'; });
  try {
    const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'selfcheck' }) });
    const h = j.result;
    App.S.health = h;
    for (const sel of ['#health-list', '#health-list2']) {
      const box = $(sel); if (box) box.innerHTML = renderHealthItems(h);
    }
    toast('自检完成：' + (h.bad && h.bad.length ? h.bad.length + ' 项异常' : '关键项正常'), h.bad && h.bad.length ? 'err' : 'ok');
    renderHeader();
  } catch (e) { toast('自检失败：' + e.message, 'err'); }
  finally { btns.forEach(b => { b.disabled = false; b.textContent = '立即自检'; }); }
}

/* ── 功能开关 ─────────────────────────────────────────── */
function featureOn(f) {
  const v = App.S.config[f.key];
  return f.kind === 'chance' ? Number(v) > 0 : !!v;
}

function renderFeatures() {
  const S = App.S;
  const feats = S.features || [];
  view.innerHTML = `<h2>功能开关 <span class="muted small">${feats.filter(featureOn).length}/${feats.length} 开启</span></h2>
    <div class="muted small" style="margin-bottom:12px">点开关即时生效。带 ⚠️/🚨 的操作会二次确认；灰色卡片表示依赖未就绪或已关闭。</div>
    <div class="grid">${feats.map(f => {
      const on = featureOn(f);
      const m = S.meta[f.key] || {};
      const risk = f.risk || m.risk;
      return `<div class="card fcard ${on ? '' : 'off'}" data-f="${f.id}">
        <div class="top"><div class="ico">${f.icon}</div><div class="grow">
          <div class="t">${esc(f.title)} ${risk ? `<span class="risk ${risk==='critical'?'critical':''}">${risk==='critical'?'高危':risk==='high'?'高风险':'注意'}</span>` : ''}</div>
          <div class="d">${esc(f.desc)}</div></div>
          ${f.kind === 'select'
            ? `<select data-select="${f.id}" style="padding:4px">${(f.options||[]).map(o => `<option ${S.config[f.key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`
            : `<label class="sw"><input type="checkbox" data-feature="${f.id}" ${on ? 'checked' : ''}><i></i></label>`}
        </div>
        <div class="small muted" style="margin-top:8px">${f.kind === 'chance'
          ? '概率 ' + pct(S.config[f.key]) + (S.config[f.key] ? '' : '（关）')
          : (on ? '已开启' : '已关闭')}${m.help ? ' · ' + esc(m.help) : ''}</div>
      </div>`;
    }).join('')}</div>`;

  $$('input[data-feature]').forEach(el => {
    el.onchange = async () => {
      const f = feats.find(x => x.id === el.dataset.feature);
      if (!f) return;
      if (!guardRisk(f.risk || (S.meta[f.key]||{}).risk, f.title)) { el.checked = !el.checked; return; }
      const on = el.checked;
      let v = on;
      if (f.kind === 'chance') {
        const cur = Number(S.config[f.key]) || 0;
        if (cur > 0) App.lastChance[f.key] = cur;
        v = on ? (App.lastChance[f.key] || f.defaultChance || 0.2) : 0;
        localStorage.setItem('wb:lastChances', JSON.stringify(App.lastChance));
      }
      const old = S.config[f.key];
      S.config[f.key] = v;
      try {
        await api('/config', { method:'POST', body: JSON.stringify({ patch: { [f.key]: v } }) });
        toast((on ? '已开启：' : '已关闭：') + f.title, 'ok');
        renderFeatures(); renderHeader();
      } catch (e) {
        S.config[f.key] = old;
        el.checked = !on;
        toast('保存失败：' + e.message, 'err');
      }
    };
  });
  // 音色下拉（select）
  $$('select[data-select]').forEach(el => {
    el.onchange = async () => {
      const f = feats.find(x => x.id === el.dataset.select);
      if (!f) return;
      const v = el.value;
      const old = S.config[f.key];
      S.config[f.key] = v;
      try {
        await api('/config', { method:'POST', body: JSON.stringify({ patch: { [f.key]: v } }) });
        toast('已切换：' + f.title + ' → ' + v, 'ok');
      } catch (e) {
        S.config[f.key] = old;
        toast('保存失败：' + e.message, 'err');
      }
    };
  });
}

function guardRisk(risk, title) {
  if (!risk || risk === 'normal' || risk === 'warn') return true;
  if (risk === 'high') return confirm('⚠️ 高风险操作：' + title + '\n\n确定继续吗？');
  if (risk === 'critical') {
    const t = prompt('🚨 高危操作：' + title + '\n\n这可能会重启微信客户端。输入「确认」继续：');
    return t === '确认';
  }
  return true;
}

/* ── 参数表单 ─────────────────────────────────────────── */
/* ── 模型目录（「人设模型」页的下拉框）─────────────────────
   数据来自 DSH 的 llm 服务（GET /models）：
     providers = 已注册的 provider（另含"声明了但没启用"的，标「未启用」）
     models    = 指定 provider 的模型清单（按需拉，切换 provider 时重拉）
   拿不到清单就退化成普通文本框 —— 绝不因为清单读不到而让人填不了字段。 */
async function loadCatalog(provider) {
  const q = provider ? ('?provider=' + encodeURIComponent(provider)) : '';
  try {
    App.catalog = await api('/models' + q);
  } catch (e) {
    App.catalog = { ok: false, providers: [], models: [], error: e.message };
  }
  return App.catalog;
}

async function renderModelPage() {
  view.innerHTML = '<div class="skel">读取 DSH 模型清单…</div>';
  await loadCatalog();
  const nav = NAV.find(n => n.id === 'model');
  if (nav) { renderParams(nav); renderModelExtra(); }
}

function pickOptions(k) {
  const C = App.catalog;
  if (!C) return null;
  if (k === 'provider' || k === 'visionProvider') {
    // 只列"已注册/已启用"的 provider —— 没配 key 的列出来也用不了，反而误导
    return (C.providers || []).filter(p => p.enabled !== false).map(p => ({
      v: p.id,
      label: (p.name && p.name !== p.id) ? (p.name + '　·　' + p.id) : p.id,
      off: false,
    }));
  }
  let models = C.models || [];
  // 视觉模型优先只列「能读图」的（DSH 里挑视觉模型也是这个逻辑）
  if (k === 'visionModel') {
    const onlyImg = models.filter(m => (m.inputModalities || []).includes('image'));
    if (onlyImg.length) models = onlyImg;
  }
  return models.map(m => ({
    v: m.id,
    label: (m.name && m.name !== m.id) ? (m.name + '　·　' + m.id) : m.id,
    off: false,
  }));
}

function pickFieldHtml(k, m) {
  const v = App.S.config[k];
  const label = esc(m.label || k);
  const help = m.help ? `<div class="help">${esc(m.help)}</div>` : '';
  const opts = pickOptions(k);
  if (!opts || !opts.length) {
    // 清单读不到 → 退回文本框（保证任何情况下都能填）
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><input type="text" style="flex:1;min-width:220px" data-k="${k}" data-t="text" value="${esc(v == null ? '' : v)}" placeholder="手填 id（DSH 模型清单没读到）"></div>${help}</div>`;
  }
  const cur = v == null ? '' : String(v);
  const has = opts.some(o => o.v === cur);
  const emptyLabel = ({
    provider: '（跟随 DSH 当前选择／最近使用）',
    model: '（不指定，用该 provider 的默认模型）',
    visionProvider: '（不单独指定，用主模型）',
    visionModel: '（不单独指定，用主模型）',
  })[k] || '（留空）';
  // 空选项始终保留：设置过之后还能选回"跟随 DSH"
  const head = `<option value="" ${cur === '' ? 'selected' : ''}>${emptyLabel}</option>`;
  const missing = (cur && !has)
    ? `<option value="${esc(cur)}" selected>${esc(cur)}　（当前值，不在清单里）</option>`
    : '';
  return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
    <div class="ctl"><select data-k="${k}" data-t="pick" style="min-width:280px">${head}${missing}${opts.map(o => `<option value="${esc(o.v)}" ${o.v === cur ? 'selected' : ''}>${esc(o.label)}${o.off ? '　（未启用）' : ''}</option>`).join('')}<option value="__custom__">✏️ 自定义（手填）…</option></select>
      <input type="text" data-picktext="${k}" style="display:none;flex:1;min-width:200px" placeholder="手填 id">
    </div>${help}</div>`;
}

function renderModelExtra() {
  const box = $('#model-extra'); if (!box) return;
  const C = App.catalog || {};
  const R = (App.S && App.S.route) || null;   // 上一次实际发生的请求，不是配置！
  const cur = C.current || {};
  const dsh = C.dshSelection;
  const models = C.models || [];

  // 以「配置」为准：provider 留空 = 跟随 DSH
  const effProvider = cur.provider || (dsh ? dsh.provider : '');
  const effModel = cur.model || ((!cur.provider && dsh) ? dsh.model : '');
  const followDsh = !cur.provider;

  // 「上次实际调用」和配置算不算同一条路由（adapter 会给模型加 -1017 这类快照后缀，宽松比较）
  const sameStr = (a, b) => {
    if (!a || !b) return true;
    if (a === b) return true;
    return a.startsWith(b) || b.startsWith(a);
  };
  const mismatch = !!R && (R.provider !== effProvider || !sameStr(R.model, effModel));

  const miss = cur.model && models.length && !models.some(m => m.id === cur.model);
  const off = (C.providers || []).filter(p => p.enabled === false).length;
  box.innerHTML = `<div class="section"><div class="hd">🎯 当前生效</div>
    <div class="row">
      <span class="pill">配置 <b>${esc((effProvider || '—') + ' / ' + (effModel || '—'))}</b>${followDsh ? '（跟随 DSH）' : ''}</span>
      ${R ? `<span class="pill">上次实际调用 <b>${esc(R.provider + ' / ' + R.model)}</b></span>` : ''}
      ${dsh ? `<span class="pill">DSH 当前 <b>${esc(dsh.provider + ' / ' + dsh.model)}</b></span>` : ''}
      <button class="btn" id="btn-model-refresh">重新读取清单</button>
    </div>
    <div class="small muted" style="margin-top:8px">
      清单来自 DSH 已注册的 provider；<b>provider 留空 = 跟随 DSH 当前选择</b>。
      ${mismatch ? '<br>⚠️ 配置和「上次实际调用」不同：刚改完的话，下一次回复就会一致（这一栏记的是上一次请求，不是配置）。' : ''}
      ${miss ? '<br>⚠️ 当前模型 <b>' + esc(cur.model) + '</b> 不在 <b>' + esc(C.modelsFor || '') + '</b> 的清单里，可能已下线，建议重选。' : ''}
      ${off ? '<br>另有 ' + off + ' 个 provider 未启用（需先在 DSH 里配 key）。' : ''}
      ${C.error ? '<br>⚠️ ' + esc(C.error) : ''}
    </div></div>`;
  const b = $('#btn-model-refresh'); if (b) b.onclick = () => renderModelPage();
}

function fieldHtml(k, m) {
  const S = App.S, v = S.config[k];
  const label = esc(m.label || k);
  const help = m.help ? `<div class="help">${esc(m.help)}</div>` : '';
  if (m.readonly) {
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div><div class="ctl mono small" style="word-break:break-all">${esc(v == null ? '' : v)}</div>${help}</div>`;
  }
  // provider / model 走"可选可填"的下拉（数据来自 DSH 的模型清单）
  if (k === 'provider' || k === 'model' || k === 'visionProvider' || k === 'visionModel') {
    return pickFieldHtml(k, m);
  }
  if (m.type === 'bool') {
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><label class="sw"><input type="checkbox" data-k="${k}" data-t="bool" ${v ? 'checked' : ''}><i></i></label>
      <span class="muted small">${v ? '已开启' : '已关闭'}</span></div>${help}</div>`;
  }
  if (m.type === 'number') {
    const min = m.min == null ? '' : `min="${m.min}"`, max = m.max == null ? '' : `max="${m.max}"`, step = m.step == null ? 'step="1"' : `step="${m.step}"`;
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><input type="range" data-range="${k}" ${min} ${max} ${step} value="${Number(v)||0}">
        <input class="num" type="number" data-k="${k}" data-t="number" ${min} ${max} ${step} value="${Number(v)||0}">
        <span class="unit">${esc(m.unit || '')}</span><span class="muted small" data-human="${k}">${humanValue(k, v, m)}</span></div>${help}</div>`;
  }
  if (m.type === 'enum') {
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><select data-k="${k}" data-t="enum">${(m.options||[]).map(o => `<option value="${esc(o)}" ${String(v)===String(o)?'selected':''}>${esc(o === '' ? '（默认/留空）' : o)}</option>`).join('')}</select></div>${help}</div>`;
  }
  if (m.type === 'textarea') {
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><textarea data-k="${k}" data-t="text">${esc(v)}</textarea></div>${help}</div>`;
  }
  if (m.type === 'csv' && Array.isArray(m.options) && m.options.length) {
    const arr = Array.isArray(v) ? v : String(v||'').split(',').map(s=>s.trim()).filter(Boolean);
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl chips">${m.options.map(o => `<label class="chip"><input type="checkbox" data-csv="${k}" value="${esc(o)}" ${arr.includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>${help}</div>`;
  }
  if (m.type === 'csv') {
    const val = Array.isArray(v) ? v.join(', ') : String(v || '');
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><input type="text" style="flex:1;min-width:220px" data-k="${k}" data-t="csv" value="${esc(val)}" placeholder="逗号分隔"></div>${help}</div>`;
  }
  const type = m.type === 'quiet' ? 'text' : 'text';
  return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
    <div class="ctl"><input type="${type}" style="flex:1;min-width:220px" data-k="${k}" data-t="text" value="${esc(v == null ? '' : v)}" ${m.type==='quiet'?'placeholder="23:00-08:00"':''}></div>${help}</div>`;
}

function humanValue(k, v, m) {
  if (m && m.unit === 'ms') return '≈ ' + fmtMs(v);
  if (m && (m.min === 0 && m.max === 1)) return pct(v);
  return '';
}

function renderParams(nav) {
  const S = App.S;
  let html = `<h2>${esc(nav.title)}</h2>`;
  for (const gid of nav.groups) {
    const g = (S.groups || []).find(x => x.id === gid) || { title: gid, desc: '' };
    const keys = Object.keys(S.meta).filter(k => S.meta[k].group === gid && !S.meta[k].hidden);
    const normal = keys.filter(k => !S.meta[k].advanced);
    const adv = keys.filter(k => S.meta[k].advanced);
    if (!keys.length) continue;
    html += `<div class="section"><div class="hd">${g.icon || ''} ${esc(g.title)} <span class="muted">${esc(g.desc || '')}</span></div>
      ${normal.map(k => fieldHtml(k, S.meta[k])).join('')}
      ${adv.length ? `<details class="adv"><summary>高级参数（${adv.length} 项）</summary>${adv.map(k => fieldHtml(k, S.meta[k])).join('')}</details>` : ''}
    </div>`;
  }
  if (nav.special === 'ops') html += '<div id="ops-extra"></div>';
  if (nav.special === 'voice') html += '<div id="voice-extra"></div>';
  if (nav.special === 'stickers') html += '<div id="sticker-extra"></div>';
  if (nav.special === 'memory') html += '<div id="memory-extra"></div>';
  if (nav.special === 'members') html += '<div id="members-extra"></div>';
  if (nav.special === 'moment') html += '<div id="moment-extra"></div>';
  if (nav.special === 'model') html += '<div id="model-extra"></div>';
  view.innerHTML = html;
  bindFields();
}

function bindFields() {
  // 滑杆 ↔ 数字框
  $$('input[data-range]').forEach(r => {
    r.oninput = () => {
      const k = r.dataset.range;
      const n = view.querySelector('input.num[data-k="' + k + '"]');
      if (n) n.value = r.value;
      updateHuman(k, r.value);
      scheduleSave(k, r.value);
    };
  });
  $$('input.num[data-k]').forEach(n => {
    n.oninput = () => {
      const k = n.dataset.k;
      const r = view.querySelector('input[type=range][data-range="' + k + '"]');
      if (r) r.value = n.value;
      updateHuman(k, n.value);
      scheduleSave(k, n.value);
    };
  });
  // 模型下拉（provider / model / visionProvider / visionModel）
  $$('select[data-t="pick"]').forEach(sel => {
    const k = sel.dataset.k;
    const box = view.querySelector('input[data-picktext="' + k + '"]');
    sel.onchange = async () => {
      if (sel.value === '__custom__') {
        // 切到自定义：露出输入框，不改配置
        if (box) { box.style.display = ''; box.focus(); }
        return;
      }
      if (box) box.style.display = 'none';
      await saveField(k, sel.value);
      if (k === 'provider') {
        // 换了 provider → 模型清单要跟着换，重拉并重绘
        await renderModelPage();
      } else {
        // 只换模型：也要让「当前生效」跟着变（重取 /state，别显示旧快照）
        await refresh({ lite: true });
      }
    };
    if (box) box.onchange = async () => {
      const val = box.value.trim();
      if (!val) return;
      await saveField(k, val);
      if (k === 'provider') await renderModelPage();
      else await refresh({ lite: true });
    };
  });
  // 其余控件
  $$('[data-k]').forEach(el => {
    const k = el.dataset.k, t = el.dataset.t;
    if (t === 'number') return;
    if (t === 'bool') { el.onchange = () => saveField(k, !!el.checked); return; }
    if (t === 'enum') { el.onchange = () => saveField(k, el.value); return; }
    if (t === 'pick') return;   // 模型下拉自己绑过了，别覆盖
    if (t === 'csv') { el.onchange = () => saveField(k, el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean)); return; }
    el.onchange = () => saveField(k, el.value);
  });
  $$('input[data-csv]').forEach(cb => {
    cb.onchange = () => {
      const k = cb.dataset.csv;
      const vals = $$('input[data-csv="' + k + '"]').filter(x => x.checked).map(x => x.value);
      saveField(k, vals);
    };
  });
}

function updateHuman(k, v) {
  const el = view.querySelector('[data-human="' + k + '"]');
  const m = App.S.meta[k];
  if (el && m) el.textContent = humanValue(k, v, m);
}

function scheduleSave(k, v) {
  clearTimeout(App.timers[k]);
  App.timers[k] = setTimeout(() => saveField(k, v), 650);
}

async function saveField(k, v) {
  const S = App.S, m = S.meta[k] || {};
  if (!guardRisk(m.risk, m.label || k)) { renderActive({}); return; }
  const old = S.config[k];
  if (typeof old === 'number') v = Number(v);
  if (m.type === 'number' && !Number.isFinite(v)) { toast('不是合法数字', 'err'); return; }
  S.config[k] = v;
  try {
    const r = await api('/config', { method:'POST', body: JSON.stringify({ patch: { [k]: v } }) });
    toast('已生效：' + (m.label || k) + (typeof v === 'number' && m.unit === 'ms' ? '（' + fmtMs(v) + '）' : ''), 'ok');
    if (r.warnings && r.warnings.length) toast(r.warnings.join('；'), 'err');
    renderHeader();
  } catch (e) {
    S.config[k] = old;
    toast('保存失败：' + e.message, 'err');
    renderActive({});
  }
}

function fillRoomSelect(sel, allowEmpty) {
  if (!sel) return;
  const rooms = (App.S.rooms||[]).map(r => ({ id:r.roomId, name:r.roomName }));
  const extra = (App.bridgeRooms||[]).map(r => ({ id:r.roomId, name:r.name }));
  const seen = new Set(); const all = [];
  for (const r of rooms.concat(extra)) { if (!r.id || seen.has(r.id)) continue; seen.add(r.id); all.push(r); }
  const prev = sel.value;
  sel.innerHTML = (allowEmpty ? '<option value="">（不选）</option>' : '') +
    all.map(r => `<option value="${esc(r.id)}" title="${esc(r.id)}">${esc(r.name || r.id)}</option>`).join('') +
    '<option value="__manual">手动输入…</option>';
  // 选项重建后浏览器会尽量保留旧值；「手动输入…」在还没有群列表时是唯一选项，
  // 拉到群列表后必须让它回到第一个真实群，否则点「读取」会拿 __manual 去查。
  if (prev && prev !== '__manual' && Array.from(sel.options).some(o => o.value === prev)) sel.value = prev;
  else if (prev === '__manual' && all.length) sel.value = all[0].id;
  else if (!prev && all.length) sel.value = all[0].id;
}

/** 状态里还没有已知群时，现从桥拉一次群列表（只读）。 */
async function ensureBridgeRooms() {
  if (App.bridgeRooms && App.bridgeRooms.length) return App.bridgeRooms;
  try {
    const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'rooms' }) });
    App.bridgeRooms = j.result || [];
  } catch (e) { toast('拉群列表失败：' + e.message, 'err'); }
  return App.bridgeRooms;
}

/** 下拉框里的「手动输入…」→ 弹框；否则取选中值。 */
function roomFrom(sel) {
  if (!sel) return '';
  if (sel.value === '__manual') return (prompt('输入群名或 roomId：') || '').trim();
  return sel.value;
}

/** 记忆保持率 → 颜色（绿/黄/红），一眼看出"快忘了" */
function memRColor(R) {
  if (R >= 0.6) return 'var(--ok)';
  if (R >= 0.3) return 'var(--warn)';
  return 'var(--bad)';
}

async function loadMemory() {
  const list = $('#mem-list'); if (!list) return;
  const statsBox = $('#mem-stats');
  const room = roomFrom($('#mem-room'));
  const showArchived = !!(document.getElementById('mem-show-archived') || {}).checked;
  list.textContent = '读取中…';
  try {
    const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'memory.list', args: { room, archived: showArchived } }) });
    const r = j.result || {};
    const st = r.stats || {};
    const facts = r.facts || [];
    if (statsBox) {
      statsBox.innerHTML = r.v2 === false
        ? '<span style="color:var(--warn)">记忆 v2 已关闭（按时间取最后 18 条，无遗忘）</span>'
        : `<b>${esc(r.roomName || room)}</b> · 生效 <b>${st.active || 0}</b> 条｜归档 ${st.archived || 0}｜固定 ${st.pinned || 0}`
          + `｜平均保持率 <b style="color:${memRColor(st.avgRetention || 0)}">${((st.avgRetention || 0) * 100).toFixed(0)}%</b>`
          + `｜平均重要度 ${((st.avgImportance || 0) * 100).toFixed(0)}%`
          + `｜⚠️ 未来 7 天预计遗忘 <b>${st.willForgetIn7d || 0}</b> 条`
          + (st.emotionBuckets && Object.keys(st.emotionBuckets).length
            ? '｜情绪：' + Object.entries(st.emotionBuckets).map(([k, v]) => esc(k) + ' ' + v).join('、')
            : '');
    }
    if (!facts.length) {
      list.innerHTML = '<div class="empty">' + (showArchived ? '没有已归档的记忆。' : '还没有长期记忆。') + '</div>';
      return;
    }
    list.innerHTML = `<table class="table"><thead><tr>
        <th style="width:44%">记忆</th><th>类型</th><th>情绪</th><th style="width:130px">保持率</th><th>重要度</th><th>用过</th><th style="width:190px">操作</th>
      </tr></thead><tbody>` + facts.slice().reverse().map((f) => {
        const R = typeof f.retention === 'number' ? f.retention : 0;
        const emo = (f.emotion && f.emotion.label) || '未知';
        const intens = (f.emotion && f.emotion.intensity) || 0;
        const pin = f.pinned ? '📌' : '';
        return `<tr>
          <td>${pin}${esc(f.text)}</td>
          <td class="mono small">${esc(f.kind || '')}</td>
          <td class="small">${esc(emo)}${intens >= 0.6 ? ' ★' : ''}</td>
          <td><div style="background:var(--line-2);border-radius:6px;height:8px;position:relative" title="保持率 ${(R * 100).toFixed(0)}%（强度 ${(f.strength || 0).toFixed(1)} 天）">
            <div style="width:${Math.max(2, R * 100).toFixed(0)}%;background:${memRColor(R)};height:8px;border-radius:6px"></div></div>
            <span class="small muted">${(R * 100).toFixed(0)}% · S=${(f.strength || 0).toFixed(1)}d</span></td>
          <td class="small">${(((f.importance || 0) * 100) | 0)}%</td>
          <td class="small">${f.recallCount || 0}${f.lastRecallAt ? '<br><span class="muted">' + esc(ago(f.lastRecallAt)) + '</span>' : ''}</td>
          <td>
            <button class="btn" data-mem-pin="${esc(f.id)}">${f.pinned ? '取消固定' : '固定'}</button>
            <button class="btn" data-mem-review="${esc(f.id)}" title="手动复习：提高强度">复习</button>
            <button class="btn" data-mem-arch="${esc(f.id)}">${f.archived ? '恢复' : '归档'}</button>
          </td></tr>`;
      }).join('') + '</tbody></table>';

    $$('[data-mem-pin]').forEach(b => b.onclick = async () => {
      try {
        const x = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'memory.pin', args: { room, id: b.dataset.memPin } }) });
        if (x.result && x.result.ok) { toast(x.result.pinned ? '已固定（永不遗忘）' : '已取消固定', 'ok'); loadMemory(); }
        else toast('失败：' + ((x.result && x.result.error) || '未知'), 'err');
      } catch (e) { toast(e.message, 'err') }
    });
    $$('[data-mem-review]').forEach(b => b.onclick = async () => {
      try {
        const x = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'memory.review', args: { room, id: b.dataset.memReview } }) });
        const rr = x.result || {};
        if (rr.ok) { toast('复习完成：强度 ' + rr.strengthBefore + 'd → ' + rr.strengthAfter + 'd', 'ok'); loadMemory(); }
        else toast('失败：' + (rr.error || '未知'), 'err');
      } catch (e) { toast(e.message, 'err') }
    });
    $$('[data-mem-arch]').forEach(b => b.onclick = async () => {
      const isArch = !!(facts.find(f => f.id === b.dataset.memArch) || {}).archived;
      try {
        const x = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'memory.archive', args: { room, id: b.dataset.memArch, archived: !isArch } }) });
        const rr = x.result || {};
        if (rr.ok) { toast(rr.archived ? '已归档（30 天内可恢复）' : '已恢复', 'ok'); loadMemory(); }
        else toast('失败：' + (rr.error || '未知'), 'err');
      } catch (e) { toast(e.message, 'err') }
    });
  } catch (e) { list.textContent = '读取失败：' + e.message; }
}

        <button class="btn" id="tts-test" title="真的合成一句话，把服务端返回原样显示">试合成</button>
      </div>
      <div id="tts-msg" class="small" style="margin-top:8px">语音发不出来时先点「试合成」——它会真的合成一句，把服务端的报错原文显示在这里。</div>
    </div>
`;
  // ── TTS 服务控制（状态 / 启动 / 停止 / 重启 / 试合成）──
  //   设计要点（2026-10-27 修）：
  //   · 点按钮**立刻**给反馈，不等后端；
  //   · 启动/重启后自动轮询状态，就绪了明确写「✅ 已启动成功（用了几秒）」；
  //   · 状态不再只显示"运行中"：区分 已停止 / 启动中 / 已就绪 / 端口异常。
  const ttsStateEl = $('#tts-state'), ttsConfigEl = $('#tts-config'), ttsMsgEl = $('#tts-msg');
  let ttsPollTimer = null, ttsWaitStart = 0;

  const ttsPaint = (r) => {
    if (!ttsStateEl) return;
    const pids = (r.pids || []).join(',');
    const st = r.state || (r.running ? 'loading' : 'stopped');
    if (st === 'ready') {
      ttsStateEl.textContent = '🟢 已就绪（端口 ' + r.port + '，PID ' + pids + '）';
      ttsStateEl.className = 'pill ok';
    } else if (st === 'loading') {
      const waited = ttsWaitStart ? Math.round((Date.now() - ttsWaitStart) / 1000) : 0;
      ttsStateEl.textContent = '🟡 启动中…（PID ' + pids + '，端口还没通' + (waited ? '，已等 ' + waited + 's' : '') + '）';
      ttsStateEl.className = 'pill warn';
    } else if (st === 'stray') {
      ttsStateEl.textContent = '⚠️ 端口 ' + r.port + ' 有人应答，但没找到 api_v2 进程';
      ttsStateEl.className = 'pill warn';
    } else {
      ttsStateEl.textContent = '⚪ 已停止（模型未加载）';
      ttsStateEl.className = 'pill';
    }
    // 启停会改 config.voiceModelOn → 勾选框必须跟着变
    const autoEl = $('#tts-autostart');
    if (autoEl && typeof r.configOn === 'boolean' && autoEl.checked !== r.configOn) autoEl.checked = r.configOn;
    if (ttsConfigEl) {
      const L = r.last || {};
      let t = '配置：' + (r.configOn ? '开机自启（voiceModelOn=开）' : '不自动启动（voiceModelOn=关）');
      // 音色模型（真正决定声音的东西）—— 之前被换掉却看不出来，现在直接显示
      if (r.vits && r.vits.name) t += '｜音色模型：' + r.vits.name;
      if (L.testAt) t += '｜上次试合成：' + (L.testOk ? '✅ ' + L.testMsg : '❌ ' + L.testMsg);
      ttsConfigEl.textContent = t;
    }
  };

  const ttsFetch = async () => {
    const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'ttsStatus' }) });
    return j.result || {};
  };

  const ttsRefresh = async () => {
    if (!ttsStateEl) return;
    try { ttsPaint(await ttsFetch()) }
    catch (e) { ttsStateEl.textContent = '状态读取失败：' + e.message; ttsStateEl.className = 'pill bad' }
  };

  const ttsStopPolling = () => { if (ttsPollTimer) { clearInterval(ttsPollTimer); ttsPollTimer = null } };

  // 启动/重启后轮询到就绪（最多 60 秒），就绪即报"成功"
  const ttsPollUntilReady = () => {
    ttsStopPolling();
    ttsWaitStart = Date.now();
    ttsPollTimer = setInterval(async () => {
      let r = null;
      try { r = await ttsFetch() } catch { return }
      ttsPaint(r);
      const spent = Math.round((Date.now() - ttsWaitStart) / 1000);
      if (r.state === 'ready') {
        ttsStopPolling(); ttsWaitStart = 0;
        ttsMsgEl.textContent = '✅ 已启动成功，用时 ' + spent + ' 秒。现在可以点「试合成」确认音质。';
        ttsMsgEl.className = 'small ok';
        toast('TTS 已就绪（' + spent + 's）', 'ok');
      } else if (spent > 60) {
        ttsStopPolling(); ttsWaitStart = 0;
        ttsMsgEl.textContent = '⚠️ 60 秒还没就绪：进程在但端口没通，多半是模型加载失败。点「试合成」看服务端原文报错。';
        ttsMsgEl.className = 'small warn';
        toast('TTS 60 秒未就绪', 'err');
      }
    }, 1500);
  };

  const ttsAct = async (action) => {
    if (!ttsMsgEl) return;
    const label = { start: '启动', stop: '停止', restart: '重启' }[action] || action;
    ttsMsgEl.className = 'small';
    ttsMsgEl.textContent = '正在执行：' + label + '…';
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'ttsControl', args: { action } }) });
      const r = j.result || {};
      const notes = (r.notes || []).join('；');
      if (action === 'stop') {
        ttsStopPolling(); ttsWaitStart = 0;
        await ttsRefresh();
        ttsMsgEl.textContent = '✅ 已停止：' + (notes || '进程已结束');
        ttsMsgEl.className = 'small ok';
        toast('TTS 已停止', 'ok');
      } else {
        ttsMsgEl.textContent = '⏳ ' + (notes || '已发出命令') + '，正在等端口就绪…';
        ttsMsgEl.className = 'small';
        toast('TTS ' + label + '：已发出命令', 'ok');
        ttsPollUntilReady();
      }
    } catch (e) {
      ttsMsgEl.textContent = '❌ ' + label + '失败：' + e.message;
      ttsMsgEl.className = 'small bad';
      toast('TTS ' + label + '失败：' + e.message, 'err');
    }
  };

  if ($('#tts-start')) $('#tts-start').onclick = () => ttsAct('start');
  if ($('#tts-stop')) $('#tts-stop').onclick = () => ttsAct('stop');
  if ($('#tts-restart')) $('#tts-restart').onclick = () => {
    if (!confirm('重启 TTS 服务？会杀掉当前 api_v2 并重新加载模型（10~40 秒，期间发不出语音）。')) return;
    ttsAct('restart');
  };
  if ($('#tts-test')) $('#tts-test').onclick = async () => {
    ttsMsgEl.className = 'small';
    ttsMsgEl.textContent = '合成中（最长 90 秒）…';
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'ttsTest' }) });
      const r = j.result || {};
      if (r.ok) {
        ttsMsgEl.textContent = '✅ 合成成功：' + r.bytes + ' 字节 / ' + r.ms + 'ms —— 语音链路正常';
        ttsMsgEl.className = 'small ok';
        toast('TTS 正常', 'ok');
      } else {
        ttsMsgEl.textContent = '❌ 合成失败：' + (r.error || '未知');
        ttsMsgEl.className = 'small bad';
        toast('TTS 异常', 'err');
      }
      await ttsRefresh();
    } catch (e) { ttsMsgEl.textContent = '❌ 试合成失败：' + e.message; ttsMsgEl.className = 'small bad' }
  };
  void ttsRefresh();

  // 「开机自启」勾选：只改意图；要停服务请点「停止」
  if ($('#tts-autostart')) $('#tts-autostart').onchange = async (e) => {
    const on = e.target.checked;
    try {
      await api('/config', { method: 'POST', body: JSON.stringify({ patch: { voiceModelOn: on } }) });
      toast(on ? '已设为开机自启' : '已取消开机自启（当前进程不动）', 'ok');
      await ttsRefresh();
    } catch (err) { e.target.checked = !on; toast('设置失败：' + err.message, 'err') }
  };
}

async function voiceSwitch(on) {
  try {
    const args = on === undefined ? {} : { on: true };
    const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'voiceSwitch', args }) });
    const el = $('#voice-state');
    if (el) el.textContent = JSON.stringify(j.result);

  } catch (e) {
    const el = $('#voice-state');
    if (el) el.textContent = '失败：' + e.message;
  }
}
