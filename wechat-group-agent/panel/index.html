<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>微信机器人控制台</title>
<style>
  :root{
    /* 深海仪表盘 —— 底色是海，唯一的亮色是磷光青 */
    --bg:#EDF2F8; --card:#FFFFFF; --card-2:#F8FAFC; --sunken:#EDF2F7;
    --text:#0E1720; --muted:#5A6B7B; --line:#DCE4EC; --line-2:#EDF2F7;
    --accent:#2F6FEB; --ok:#0E9285; --warn:#B87328; --bad:#CC4B4B;
    --chip:#EDF2F7; --teal:#35C4B5;
    --shadow:none; --r:4px;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0B1622; --card:#12243A; --card-2:#0F1D30; --sunken:#0D1B2C;
      --text:#E6EDF3; --muted:#8FA3B5; --line:#1F3550; --line-2:#182A40;
      --accent:#5B8DEF; --ok:#35C4B5; --warn:#E0A458; --bad:#F0736A; --chip:#16273D;
      --shadow:none;}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    font-feature-settings:"tnum" 1;
    -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent);text-underline-offset:2px}

  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:9px 16px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .brand{font-weight:600;font-size:14.5px;white-space:nowrap;letter-spacing:.01em}
  .brand small{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}
  .pills{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:3px;background:var(--sunken);
    font-size:11.5px;color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
  .pill b{font-weight:500;color:var(--text)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
  .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  .hswitch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}

  .shell{display:flex;min-height:calc(100vh - 55px)}
  nav{width:176px;flex:0 0 176px;padding:12px 8px;border-right:1px solid var(--line);
    position:sticky;top:55px;height:calc(100vh - 55px);overflow:auto}
  nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:3px;color:var(--text);
    text-decoration:none;font-size:13px;margin-bottom:1px;transition:background .12s}
  nav a:hover{background:var(--sunken)}
  nav a.on{background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
  main{flex:1;min-width:0;padding:18px 20px 64px;max-width:1200px}

  .banner{display:none;padding:9px 12px;border-radius:var(--r);margin-bottom:12px;font-size:13px;
    border:1px solid var(--line);border-left-width:3px}
  .banner.show{display:block}
  .banner.bad{background:color-mix(in srgb,var(--bad) 8%,transparent);border-color:color-mix(in srgb,var(--bad) 30%,var(--line));border-left-color:var(--bad)}
  .banner.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,var(--line));border-left-color:var(--warn)}

  h2{font-size:16px;margin:2px 0 14px;font-weight:600;letter-spacing:.01em}
  h2 .muted{font-weight:400}
  h3{font-size:12px;margin:20px 0 8px;color:var(--muted);font-weight:600;
    letter-spacing:.06em;text-transform:none}

  /* 指标卡：不是胖卡片，是"读数" */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .card{background:var(--card-2);border:1px solid var(--line-2);border-left:2px solid var(--line);
    border-radius:var(--r);padding:12px 13px}
  .card .t{font-weight:500;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .card .d{color:var(--muted);font-size:11.5px;margin-top:4px;line-height:1.5}
  .card .k{font-size:27px;font-weight:600;margin-top:5px;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;line-height:1.15}
  .card .k .muted{font-size:13px;font-weight:400;letter-spacing:0}

  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .grow{flex:1}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:3px;border:1px solid var(--line);
    background:var(--card);cursor:pointer;font-size:13px;transition:border-color .12s,background .12s}
  .btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--card-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000);border-color:transparent}
  .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
  .btn:disabled{opacity:.45;cursor:default}
  .btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:1px}

  .sw{position:relative;display:inline-block;width:40px;height:22px;flex:0 0 auto;vertical-align:middle}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw i{position:absolute;inset:0;background:var(--line);border-radius:3px;transition:.16s;cursor:pointer}
  .sw i:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:2px;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw input:checked+i{background:var(--ok)}
  .sw input:checked+i:before{transform:translateX(18px)}
  .sw input:disabled+i{opacity:.4;cursor:not-allowed}

  .fcard{position:relative}
  .fcard .top{display:flex;align-items:flex-start;gap:10px}
  .fcard .ico{font-size:18px;line-height:1.1;opacity:.9}
  .fcard .risk{font-size:10px;padding:1px 6px;border-radius:2px;border:1px solid var(--line);color:var(--warn);
    letter-spacing:.02em}
  .fcard .risk.critical{color:var(--bad)}
  .fcard.off{opacity:.6}

  .field{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 16px;padding:9px 0;
    border-bottom:1px solid var(--line-2);align-items:center}
  .field:last-child{border-bottom:0}
  .field .lab{font-size:13px}
  .field .help{grid-column:2;color:var(--muted);font-size:11.5px;margin-top:-4px;line-height:1.5}
  .field .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  input[type=text],input[type=number],input[type=password],select,textarea{
    background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 9px;outline:none;min-width:0}
  input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,select:focus,textarea:focus{
    border-color:var(--accent)}
  input[type=range]{accent-color:var(--accent);width:150px}
  textarea{width:100%;min-height:120px;resize:vertical;line-height:1.5}
  .num{width:92px}
  .unit{color:var(--muted);font-size:12px}

  /* 分组：标题 + 细线，不做胖卡片 */
  .section{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);
    padding:4px 15px 12px;margin-bottom:12px}
  .section>.hd{display:flex;align-items:center;gap:10px;padding:11px 0 8px;font-weight:600;font-size:13.5px;
    border-bottom:1px solid var(--line-2);margin-bottom:6px}
  .section>.hd .muted{font-weight:400;font-size:11.5px}

  details.adv{margin-top:8px;border-top:1px solid var(--line-2);padding-top:6px}
  details.adv summary{cursor:pointer;color:var(--muted);font-size:12.5px;padding:6px 0}

  .table{width:100%;border-collapse:collapse;font-size:13px}
  .table th,.table td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
  .table th{color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.02em}
  .table tr:last-child td{border-bottom:0}

  .feed{max-height:320px;overflow:auto;font-size:13px}
  .feed .line{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-2)}
  .feed .time{color:var(--muted);font-size:11px;white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
  .feed .who{font-weight:500;white-space:nowrap}
  .feed .txt{word-break:break-word}

  .logbox{background:#08111B;color:#C7D6E5;border:1px solid var(--line);border-radius:var(--r);padding:12px;
    height:420px;overflow:auto;font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0E1720;color:#fff;
    padding:9px 16px;border-radius:3px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;
    max-width:80vw;box-shadow:0 6px 24px rgba(0,0,0,.28)}
  .toast.show{opacity:1}
  .toast.err{background:var(--bad)}
  .toast.ok{background:var(--ok)}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:2px;background:var(--sunken);
    font-size:11.5px;border:1px solid var(--line-2)}
  .empty{color:var(--muted);font-size:13px;padding:12px 0}
  .kbd{font:11px ui-monospace,Consolas,monospace;background:var(--sunken);border:1px solid var(--line);
    border-radius:2px;padding:1px 4px}
  .skel{color:var(--muted);padding:20px 0}

  /* 眼睛页的拖放区：全页唯一的视觉重笔（声呐/舷窗感） */
  #eyes-drop{border-radius:2px !important;border-color:var(--line) !important;
    background:
      radial-gradient(circle at 50% 42%, color-mix(in srgb,var(--teal) 13%,transparent), transparent 68%),
      var(--card-2) !important;
    transition:border-color .15s,background .15s !important}
  #eyes-drop:hover{border-color:color-mix(in srgb,var(--teal) 55%,var(--line)) !important}

  @media (max-width: 760px){
    .shell{display:block}
    nav{width:auto;position:sticky;top:55px;height:auto;border-right:0;border-bottom:1px solid var(--line);
      display:flex;overflow:auto;gap:2px;padding:6px 8px;background:var(--card);z-index:15}
    nav a{margin:0;white-space:nowrap;padding:6px 10px}
    nav a.on{box-shadow:inset 0 -2px 0 var(--accent)}
    main{padding:14px 12px 60px}
    .field{grid-template-columns:1fr}
    .field .help{grid-column:1}
    .pills{order:3;flex-basis:100%}
    .card .k{font-size:23px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<header>
  <div class="brand">🐟 微信机器人控制台 <small id="ver"></small></div>
  <div class="pills" id="pills"><span class="pill">加载中…</span></div>
  <label class="hswitch">总开关 <span class="sw"><input type="checkbox" id="m-enabled"><i></i></span></label>
  <label class="hswitch">演练 <span class="sw"><input type="checkbox" id="m-dry"><i></i></span></label>
</header>

<div class="shell">
  <nav id="nav"></nav>
  <main>
    <div id="banner" class="banner"></div>
    <div id="view" class="skel">正在读取机器人状态…</div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const view = $('#view');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
const fmtTime = (ts) => { if (!ts) return '—'; const d = new Date(ts); return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
const ago = (ts) => { if (!ts) return '—'; const s = Math.round((Date.now()-ts)/1000); if (s<60) return s+' 秒前'; if (s<3600) return Math.round(s/60)+' 分钟前'; if (s<86400) return Math.round(s/3600)+' 小时前'; return Math.round(s/86400)+' 天前'; };
const fmtMs = (v) => { const n = Number(v)||0; if (n >= 3600000) return (n/3600000).toFixed(n%3600000?1:0)+' 小时'; if (n >= 60000) return (n/60000).toFixed(n%60000?1:0)+' 分钟'; if (n >= 1000) return (n/1000).toFixed(n%1000?1:0)+' 秒'; return n+' ms'; };
const pct = (v) => Math.round((Number(v)||0)*100)+'%';
// token 数字友好化：1234 → 1.2K，1234567 → 1.23M
const fmtTokens = (v) => {
  const n = Number(v) || 0;
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
};

const NAV = [
  {id:'overview', title:'总览', icon:'📊'},
  {id:'features', title:'功能开关', icon:'🎛'},
  {id:'reply', title:'回复节奏', icon:'💬', groups:['reply']},
  {id:'proactive', title:'主动行为', icon:'🌱', groups:['proactive']},
  {id:'style', title:'说话方式', icon:'🗣', groups:['style']},
  {id:'sticker', title:'表情包', icon:'😄', groups:['sticker'], special:'stickers'},
  {id:'senses', title:'感知', icon:'🖼', groups:['vision','link','douyin']},
  {id:'voice', title:'语音', icon:'🎙', groups:['voiceIn','voiceOut'], special:'voice'},
  {id:'memory', title:'记忆', icon:'🧠', groups:['memory'], special:'memory'},
  {id:'identity', title:'群与人', icon:'👥', groups:['identity'], special:'members'},
  {id:'providers', title:'模型接口', icon:'🧩'},
  {id:'model', title:'人设模型', icon:'🐟', groups:['model']},
  {id:'eyes', title:'眼睛', icon:'👁', special:'eyes'},
  {id:'diag', title:'诊断', icon:'🔬', special:'diag'},
  {id:'update', title:'更新', icon:'📦', special:'update'},
  {id:'ops', title:'运维日志', icon:'🩺', groups:['health','selfheal','advanced'], special:'ops'},
  {id:'manual', title:'手动操作', icon:'🕹'},
];

const App = {
  S: null,  tab: localStorage.getItem('wb:tab') || 'overview',
  timers: {},
  lastChance: JSON.parse(localStorage.getItem('wb:lastChances') || '{}'),
  bridgeRooms: [],
  members: [],
  memory: null,
  stickers: null,
  logsAuto: false,
  logsTimer: null,
  pending: new Set(),
  providers: null,
  image: null,
};

/* ── HTTP ─────────────────────────────────────────────── */
async function api(path, opts) {
  const r = await fetch('/wechat-bot/api' + path, Object.assign({ credentials:'same-origin' }, opts, {
    headers: Object.assign({ 'content-type':'application/json' }, (opts && opts.headers) || {}),
  }));
  const text = await r.text();
  let j; try { j = JSON.parse(text); } catch { throw new Error('响应不是 JSON（HTTP '+r.status+'）'); }
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
let toastTimer = null;
function toast(msg, kind) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, kind === 'err' ? 4200 : 2200);
}

/* ── 载入状态 ─────────────────────────────────────────── */
async function refresh(opts) {
  opts = opts || {};
  try {
    const [j, u] = await Promise.all([
      api('/state' + (opts.lite ? '?lite=1' : '')),
      api('/action', { method: 'POST', body: JSON.stringify({ op: 'usage' }) }).catch(() => null),
    ]);
    App.S = j;
    if (u && u.result) App.usage = u.result;
    renderHeader();
    if (App.tab === 'overview' || !opts.lite) renderActive(opts);
  } catch (e) {
    toast('读取状态失败：' + e.message, 'err');
    if (!App.S) view.innerHTML = '<div class="card">读取状态失败：' + esc(e.message) + '<br><br><button class="btn" onclick="refresh()">重试</button></div>';
  }
}

/* ── 诊断（崩溃 / 数据库 / 眼睛 / 磁盘）──────────────────
   为什么单独拉：要连 hook 的三个诊断端点，慢（并发也有 6 秒上限），
   所以只在「诊断」页和总览的崩溃卡需要时才拉，拉完缓存 60 秒。 */
async function loadDiag(force) {
  const now = Date.now();
  if (!force && App.diag && now - (App.diagAt || 0) < 60_000) return App.diag;
  try {
    const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'diag' }) });
    App.diag = (j && j.result) || null;
    App.diagAt = now;
    return App.diag;
  } catch (e) {
    App.diag = { error: e.message };
    App.diagAt = now;
    return App.diag;
  }
}


function renderHeader() {
  const S = App.S;
  if (!S) return;
  $('#ver').textContent = 'v' + (S.version || '') + ' · ' + (S.stats ? (S.stats.replied + '/' + S.stats.msgIn) : '');
  const br = S.bridge || {};
  const st = br.status || {};
  const h = S.health || {};
  const findItem = (name) => (h.items || []).find(x => String(x.name||'').indexOf(name) >= 0);
  const hook = findItem('hook 存活');
  const pills = [
    {t:'桥', ok: br.connected, text: br.connected ? '已连接' : '未连接'},
    {t:'微信', ok: st.loggedIn, text: st.loggedIn ? (st.self || '已登录') : (br.connected ? '未登录' : '未知')},
    {t:'hook', ok: hook ? hook.level === 'ok' : null, text: hook ? (hook.level === 'ok' ? '正常' : hook.text) : '未检查'},
  ];
  $('#pills').innerHTML = pills.map(p => '<span class="pill"><span class="dot ' + (p.ok === true ? 'ok' : p.ok === false ? 'bad' : '') + '"></span>' + esc(p.t) + ' <b>' + esc(p.text) + '</b></span>').join('')
    + (S.route ? '<span class="pill">模型 <b>' + esc((S.route.provider||'') + '/' + (S.route.model||'')) + '</b></span>' : '');

  $('#m-enabled').checked = !!S.config.enabled;
  $('#m-dry').checked = !!S.config.dryRun;
  const b = $('#banner');
  if (!S.config.enabled) { b.className = 'banner bad show'; b.textContent = '⛔ 机器人已停用：仍会收消息、记上下文/记忆，但不回复、不主动发言。'; }
  else if (S.config.dryRun) { b.className = 'banner warn show'; b.textContent = '🧪 演练模式：完整走决策，但不调 LLM、不发送任何消息。'; }
  else { b.className = 'banner'; b.textContent = ''; }
  // 🆕 有新版：顶部追加提示（不覆盖上面的停用/演练提示，用独立提示条）
  let ub = document.getElementById('update-banner')
  if (!ub) { ub = document.createElement('div'); ub.id = 'update-banner'; ub.className = 'banner warn'; document.body.insertBefore(ub, document.body.firstChild.nextSibling) }
  const up = App.upd
  if (up && up.available) {
    ub.className = 'banner warn show'
    ub.innerHTML = '🆕 有新版本 <b>' + esc('v' + (up.remoteVersion || '')) + '</b>（' + (up.behind || 0) + ' 个提交） · <a href="#" id="upd-link">查看并更新</a>'
    setTimeout(() => { const l = document.getElementById('upd-link'); if (l) l.onclick = (ev) => { ev.preventDefault(); App.tab = 'update'; localStorage.setItem('wb:tab', 'update'); renderNav(); renderActive({}) } }, 0)
  } else { ub.className = 'banner' }
}

/* ── 导航 ─────────────────────────────────────────────── */
function renderNav() {
  $('#nav').innerHTML = NAV.map(n =>
    '<a href="#' + n.id + '" data-tab="' + n.id + '" class="' + (App.tab === n.id ? 'on' : '') + '">' + n.icon + ' ' + esc(n.title) + '</a>'
  ).join('');
  $$('#nav a').forEach(a => a.onclick = (e) => {
    e.preventDefault();
    App.tab = a.dataset.tab;
    localStorage.setItem('wb:tab', App.tab);
    renderNav();
    renderActive({});
  });
}

function renderActive(opts) {
  if (!App.S) return;
  const nav = NAV.find(n => n.id === App.tab);
  if (!nav) { App.tab = 'overview'; return renderActive(opts); }
  if (nav.id === 'overview') return renderOverview();
  if (nav.id === 'features') return renderFeatures();
  if (nav.id === 'providers') return renderProviders();
  if (nav.id === 'manual') return renderManual();
  if (nav.id === 'eyes') return renderEyes();
  if (nav.id === 'diag') return renderDiag();
  if (nav.id === 'update') return renderUpdate();
  if (nav.groups) {
    renderParams(nav);
    if (nav.special === 'stickers') renderStickerExtra();
    if (nav.special === 'memory') renderMemoryExtra();
    if (nav.special === 'members') renderMembersExtra();
    if (nav.special === 'ops') renderOpsExtra();
    if (nav.special === 'voice') renderVoiceExtra();
  }
}

function providerName(id) {
  const p = (App.providers?.configurable || []).find(x => x.provider === id)
  const preset = PROVIDER_PRESETS.find(x => x.id === id)
  return preset?.name || p?.displayName || id
}

function piProfiles() {
  const pi = (App.providers?.settings || []).find(s => s.ns === 'llm-pi-ai')
  return pi?.value?.providers || {}
}

function isRegistered(id) {
  return (App.providers?.registered || []).some(x => x.id === id)
}

  const p = await api('/providers')
  App.providers = p
  try { App.image = (await api('/image')).config } catch { App.image = null }

function bindProviderEvents() {
  $$('[data-provider-edit]').forEach(b => b.onclick = () => fillProviderForm(b.dataset.providerEdit))
  $$('[data-provider-del]').forEach(b => b.onclick = async () => {
    const id = b.dataset.providerDel
    if (!confirm('删除服务商「' + providerName(id) + '」的配置？\n（凭据保留，可重新启用）')) return
    try {
      await api('/providers/remove', { method: 'POST', body: JSON.stringify({ provider: id }) })
      toast('已删除 ' + id, 'ok'); renderProviders()
    } catch (e) { toast('删除失败：' + e.message, 'err') }
  })
  $$('[data-provider-test]').forEach(b => b.onclick = () => {
    $('#test-provider').value = b.dataset.providerTest
    $('#test-model').focus()
    $('#provider-form')?.scrollIntoView({ behavior: 'smooth' })
  })
  $$('[data-provider-chat]').forEach(b => b.onclick = () => useProvider(b.dataset.providerChat, 'chat'))
  $$('[data-provider-vision]').forEach(b => b.onclick = () => useProvider(b.dataset.providerVision, 'vision'))

  $('#pf-provider').onchange = () => {
    const id = $('#pf-provider').value
    const profile = piProfiles()[id] || {}
    $('#pf-display').value = profile.displayName || providerName(id)
    $('#pf-base').value = profile.baseURL || ''
    $('#pf-api').value = profile.api || ''
    $('#pf-models').value = (profile.models || []).map(m => m.id).join(', ')
    $('#pf-keyref').value = profile.apiKeyEnv || KEY_REF_SUGGEST[id] || ''
  }
  $('#pf-save').onclick = async () => {
    const body = {
      provider: $('#pf-provider').value,
      displayName: $('#pf-display').value.trim(),
      keyRef: $('#pf-keyref').value.trim(),
      baseURL: $('#pf-base').value.trim(),
      api: $('#pf-api').value,
      models: $('#pf-models').value.trim(),
    }
    const key = $('#pf-key').value.trim()
    if (key) body.apiKey = key
    const btn = $('#pf-save'); btn.disabled = true; btn.textContent = '保存中…'
    try {
      await api('/providers/save', { method: 'POST', body: JSON.stringify(body) })
      toast('已保存 ' + body.provider + '（路由已注册）', 'ok')
      $('#pf-key').value = ''
      renderProviders()
    } catch (e) { toast('保存失败：' + e.message, 'err'); $('#pf-msg').textContent = e.message }
    finally { btn.disabled = false; btn.textContent = '保存' }
  }

  $('#btn-provider-test').onclick = async () => {
    const provider = $('#test-provider').value
    const model = $('#test-model').value.trim()
    const btn = $('#btn-provider-test'); btn.disabled = true; btn.textContent = '测试中…'
    $('#test-out').textContent = ''
    try {
      const j = await api('/providers/test', { method: 'POST', body: JSON.stringify({ provider, model }) })
      $('#test-out').textContent = `✅ ${j.provider} / ${j.model} · ${j.ms}ms\n返回：${j.text || '（空）'}`
      toast('连通正常（' + j.ms + 'ms）', 'ok')
    } catch (e) {
      $('#test-out').textContent = '❌ ' + e.message
      toast('测试失败：' + e.message, 'err')
    } finally { btn.disabled = false; btn.textContent = '测试' }
  }

  $$('[data-image-preset]').forEach(b => b.onclick = () => {
    const p = IMAGE_PRESETS[b.dataset.imagePreset]
    if (!p) return
    $('#img-url').value = p.apiUrl
    $('#img-model').value = p.model
    $('#img-keyref').value = p.keyRef
    $('#img-mode').value = p.mode
    $('#img-style').value = p.style
  })

  $('#img-save').onclick = async () => {
    const body = {
      apiUrl: $('#img-url').value.trim(),
      model: $('#img-model').value.trim(),
      keyRef: $('#img-keyref').value.trim(),
      mode: $('#img-mode').value,
      style: $('#img-style').value,
    }
    const key = $('#img-key').value.trim()
    if (key) body.apiKey = key
    try {
      const j = await api('/image', { method: 'POST', body: JSON.stringify(body) })
      App.image = j.config
      $('#img-key').value = ''
      toast('图像接口已保存', 'ok')
      renderProviders()
    } catch (e) { toast('保存失败：' + e.message, 'err') }
  }

  $('#img-test').onclick = async () => {
    if (!confirm('真实生成一张测试表情包？会调用生图接口并入库（有成本）。')) return
    const btn = $('#img-test'); btn.disabled = true; btn.textContent = '生成中…'
    $('#img-msg').textContent = ''
    try {

    finally { btn.disabled = false; btn.textContent = '生成一张测试图' }
  }
}

async function useProvider(id, target) {
  let model = prompt('模型 id（留空 = 自动选第一个）\n服务商：' + id, '')
  if (model === null) return
  model = model.trim()
  if (!model) {
    try {
      const j = await api('/providers/models?provider=' + encodeURIComponent(id))
      const list = Array.isArray(j.models) ? j.models : []
      const pick = target === 'vision' ? (list.find(m => (m.modalities || []).includes('image')) || list[0]) : list[0]
      if (!pick) return toast('这个服务商没有可自动挑选的模型，请手填', 'err')
      model = pick.id
    } catch (e) { return toast('取模型列表失败：' + e.message, 'err') }
  }
  const patch = target === 'vision' ? { visionProvider: id, visionModel: model } : { provider: id, model }
  try {
    await api('/config', { method: 'POST', body: JSON.stringify({ patch }) })
    if (target === 'vision') { App.S.config.visionProvider = id; App.S.config.visionModel = model }
    else { App.S.config.provider = id; App.S.config.model = model }
    toast((target === 'vision' ? '视觉' : '聊天') + '路由已切到 ' + id + ' / ' + model, 'ok')
    renderHeader()
  } catch (e) { toast('切换失败：' + e.message, 'err') }
}

    </div>`;

  $('#btn-refresh').onclick = () => refresh();
  $('#btn-check').onclick = runSelfcheck;
  $('#btn-diag').onclick = () => { location.hash = '#diag'; };

  // 崩溃卡：diag 比较慢（要连 hook），先显示"检测中"，拿到再回填
  loadDiag().then(d => {

  });

function renderHealthItems(h) {
  if (!h || !h.items || !h.items.length) return '<div class="empty">还没有检查过。点「立即自检」跑一遍全链路。</div>';
  const icon = lv => lv === 'ok' ? '✅' : lv === 'warn' ? '⚠️' : '❌';
  return h.items.map(it => `<div style="padding:6px 0;border-bottom:1px dashed var(--line)">
    <b>${icon(it.level)} ${esc(it.name)}</b> <span class="muted">${esc(it.text)}</span>
    ${it.advice ? '<div class="small" style="color:var(--warn);margin-top:2px">建议：' + esc(it.advice) + '</div>' : ''}</div>`).join('');
}

async function runSelfcheck() {
  const btn = $('#btn-check'); if (btn) { btn.disabled = true; btn.textContent = '检查中…'; }
  try {
    const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'selfcheck' }) });
    const h = j.result;
    App.S.health = h;
    const box = $('#health-list'); if (box) box.innerHTML = renderHealthItems(h);
    toast('自检完成：' + (h.bad && h.bad.length ? h.bad.length + ' 项异常' : '关键项正常'), h.bad && h.bad.length ? 'err' : 'ok');
    renderHeader();
  } catch (e) { toast('自检失败：' + e.message, 'err'); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '立即自检'; } }
}

/* ── 功能开关 ─────────────────────────────────────────── */
function featureOn(f) {
  const v = App.S.config[f.key];
  return f.kind === 'chance' ? Number(v) > 0 : !!v;
}

function renderFeatures() {
  const S = App.S;
  const feats = S.features || [];
  view.innerHTML = `<h2>功能开关 <span class="muted small">${feats.filter(featureOn).length}/${feats.length} 开启</span></h2>
    <div class="muted small" style="margin-bottom:12px">点开关即时生效。带 ⚠️/🚨 的操作会二次确认；灰色卡片表示依赖未就绪或已关闭。</div>
    <div class="grid">${feats.map(f => {
      const on = featureOn(f);
      const m = S.meta[f.key] || {};
      const risk = f.risk || m.risk;
      return `<div class="card fcard ${on ? '' : 'off'}" data-f="${f.id}">
        <div class="top"><div class="ico">${f.icon}</div><div class="grow">
          <div class="t">${esc(f.title)} ${risk ? `<span class="risk ${risk==='critical'?'critical':''}">${risk==='critical'?'高危':risk==='high'?'高风险':'注意'}</span>` : ''}</div>
          <div class="d">${esc(f.desc)}</div></div>
          <label class="sw"><input type="checkbox" data-feature="${f.id}" ${on ? 'checked' : ''}><i></i></label>
        </div>
        <div class="small muted" style="margin-top:8px">${f.kind === 'chance'
          ? '概率 ' + pct(S.config[f.key]) + (S.config[f.key] ? '' : '（关）')
          : (on ? '已开启' : '已关闭')}${m.help ? ' · ' + esc(m.help) : ''}</div>
      </div>`;
    }).join('')}</div>`;

  $$('input[data-feature]').forEach(el => {
    el.onchange = async () => {
      const f = feats.find(x => x.id === el.dataset.feature);
      if (!f) return;
      if (!guardRisk(f.risk || (S.meta[f.key]||{}).risk, f.title)) { el.checked = !el.checked; return; }
      const on = el.checked;
      let v = on;
      if (f.kind === 'chance') {
        const cur = Number(S.config[f.key]) || 0;
        if (cur > 0) App.lastChance[f.key] = cur;
        v = on ? (App.lastChance[f.key] || f.defaultChance || 0.2) : 0;
        localStorage.setItem('wb:lastChances', JSON.stringify(App.lastChance));
      }
      const old = S.config[f.key];
      S.config[f.key] = v;
      try {
        await api('/config', { method:'POST', body: JSON.stringify({ patch: { [f.key]: v } }) });
        toast((on ? '已开启：' : '已关闭：') + f.title, 'ok');
        renderFeatures(); renderHeader();
      } catch (e) {
        S.config[f.key] = old;
        el.checked = !on;
        toast('保存失败：' + e.message, 'err');
      }
    };
  });
}

function guardRisk(risk, title) {
  if (!risk || risk === 'normal' || risk === 'warn') return true;
  if (risk === 'high') return confirm('⚠️ 高风险操作：' + title + '\n\n确定继续吗？');
  if (risk === 'critical') {
    const t = prompt('🚨 高危操作：' + title + '\n\n这可能会重启微信客户端。输入「确认」继续：');
    return t === '确认';
  }
  return true;
}

/* ── 参数表单 ─────────────────────────────────────────── */
function fieldHtml(k, m) {
  const S = App.S, v = S.config[k];
  const label = esc(m.label || k);
  const help = m.help ? `<div class="help">${esc(m.help)}</div>` : '';
  if (m.readonly) {
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div><div class="ctl mono small" style="word-break:break-all">${esc(v == null ? '' : v)}</div>${help}</div>`;
  }
  if (m.type === 'bool') {
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><label class="sw"><input type="checkbox" data-k="${k}" data-t="bool" ${v ? 'checked' : ''}><i></i></label>
      <span class="muted small">${v ? '已开启' : '已关闭'}</span></div>${help}</div>`;
  }
  if (m.type === 'number') {
    const min = m.min == null ? '' : `min="${m.min}"`, max = m.max == null ? '' : `max="${m.max}"`, step = m.step == null ? 'step="1"' : `step="${m.step}"`;
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><input type="range" data-range="${k}" ${min} ${max} ${step} value="${Number(v)||0}">
        <input class="num" type="number" data-k="${k}" data-t="number" ${min} ${max} ${step} value="${Number(v)||0}">
        <span class="unit">${esc(m.unit || '')}</span><span class="muted small" data-human="${k}">${humanValue(k, v, m)}</span></div>${help}</div>`;
  }
  if (m.type === 'enum') {
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><select data-k="${k}" data-t="enum">${(m.options||[]).map(o => `<option value="${esc(o)}" ${String(v)===String(o)?'selected':''}>${esc(o === '' ? '（默认/留空）' : o)}</option>`).join('')}</select></div>${help}</div>`;
  }
  if (m.type === 'textarea') {
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><textarea data-k="${k}" data-t="text">${esc(v)}</textarea></div>${help}</div>`;
  }
  if (m.type === 'csv' && Array.isArray(m.options) && m.options.length) {
    const arr = Array.isArray(v) ? v : String(v||'').split(',').map(s=>s.trim()).filter(Boolean);
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl chips">${m.options.map(o => `<label class="chip"><input type="checkbox" data-csv="${k}" value="${esc(o)}" ${arr.includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>${help}</div>`;
  }
  if (m.type === 'csv') {
    const val = Array.isArray(v) ? v.join(', ') : String(v || '');
    return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
      <div class="ctl"><input type="text" style="flex:1;min-width:220px" data-k="${k}" data-t="csv" value="${esc(val)}" placeholder="逗号分隔"></div>${help}</div>`;
  }
  const type = m.type === 'quiet' ? 'text' : 'text';
  return `<div class="field" data-field="${k}"><div class="lab">${label}</div>
    <div class="ctl"><input type="${type}" style="flex:1;min-width:220px" data-k="${k}" data-t="text" value="${esc(v == null ? '' : v)}" ${m.type==='quiet'?'placeholder="23:00-08:00"':''}></div>${help}</div>`;
}

function humanValue(k, v, m) {
  if (m && m.unit === 'ms') return '≈ ' + fmtMs(v);
  if (m && (m.min === 0 && m.max === 1)) return pct(v);
  return '';
}

function renderParams(nav) {
  const S = App.S;
  let html = `<h2>${esc(nav.title)}</h2>`;
  for (const gid of nav.groups) {
    const g = (S.groups || []).find(x => x.id === gid) || { title: gid, desc: '' };
    const keys = Object.keys(S.meta).filter(k => S.meta[k].group === gid && !S.meta[k].hidden);
    const normal = keys.filter(k => !S.meta[k].advanced);
    const adv = keys.filter(k => S.meta[k].advanced);
    if (!keys.length) continue;
    html += `<div class="section"><div class="hd">${g.icon || ''} ${esc(g.title)} <span class="muted">${esc(g.desc || '')}</span></div>
      ${normal.map(k => fieldHtml(k, S.meta[k])).join('')}
      ${adv.length ? `<details class="adv"><summary>高级参数（${adv.length} 项）</summary>${adv.map(k => fieldHtml(k, S.meta[k])).join('')}</details>` : ''}
    </div>`;
  }
  if (nav.special === 'ops') html += '<div id="ops-extra"></div>';
  if (nav.special === 'voice') html += '<div id="voice-extra"></div>';
  if (nav.special === 'stickers') html += '<div id="sticker-extra"></div>';
  if (nav.special === 'memory') html += '<div id="memory-extra"></div>';
  if (nav.special === 'members') html += '<div id="members-extra"></div>';
  view.innerHTML = html;
  bindFields();
}

function bindFields() {
  // 滑杆 ↔ 数字框
  $$('input[data-range]').forEach(r => {
    r.oninput = () => {
      const k = r.dataset.range;
      const n = view.querySelector('input.num[data-k="' + k + '"]');
      if (n) n.value = r.value;
      updateHuman(k, r.value);
      scheduleSave(k, r.value);
    };
  });
  $$('input.num[data-k]').forEach(n => {
    n.oninput = () => {
      const k = n.dataset.k;
      const r = view.querySelector('input[type=range][data-range="' + k + '"]');
      if (r) r.value = n.value;
      updateHuman(k, n.value);
      scheduleSave(k, n.value);
    };
  });
  // 其余控件
  $$('[data-k]').forEach(el => {
    const k = el.dataset.k, t = el.dataset.t;
    if (t === 'number') return;
    if (t === 'bool') { el.onchange = () => saveField(k, !!el.checked); return; }
    if (t === 'enum') { el.onchange = () => saveField(k, el.value); return; }
    if (t === 'csv') { el.onchange = () => saveField(k, el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean)); return; }
    el.onchange = () => saveField(k, el.value);
  });
  $$('input[data-csv]').forEach(cb => {
    cb.onchange = () => {
      const k = cb.dataset.csv;
      const vals = $$('input[data-csv="' + k + '"]').filter(x => x.checked).map(x => x.value);
      saveField(k, vals);
    };
  });
}

function updateHuman(k, v) {
  const el = view.querySelector('[data-human="' + k + '"]');
  const m = App.S.meta[k];
  if (el && m) el.textContent = humanValue(k, v, m);
}

function scheduleSave(k, v) {
  clearTimeout(App.timers[k]);
  App.timers[k] = setTimeout(() => saveField(k, v), 650);
}

async function saveField(k, v) {
  const S = App.S, m = S.meta[k] || {};
  if (!guardRisk(m.risk, m.label || k)) { renderActive({}); return; }
  const old = S.config[k];
  if (typeof old === 'number') v = Number(v);
  if (m.type === 'number' && !Number.isFinite(v)) { toast('不是合法数字', 'err'); return; }
  S.config[k] = v;
  try {
    const r = await api('/config', { method:'POST', body: JSON.stringify({ patch: { [k]: v } }) });
    toast('已生效：' + (m.label || k) + (typeof v === 'number' && m.unit === 'ms' ? '（' + fmtMs(v) + '）' : ''), 'ok');
    if (r.warnings && r.warnings.length) toast(r.warnings.join('；'), 'err');
    renderHeader();
  } catch (e) {
    S.config[k] = old;
    toast('保存失败：' + e.message, 'err');
    renderActive({});
  }
}

async function loadStickers() {

    const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'stickers', args:{ limit: 80 } }) });

    box.innerHTML = `<div class="muted small" style="margin-bottom:6px">共 ${(r.stats&&r.stats.count)||items.length} 张 · ${(r.stats&&r.stats.mb)||0} MB</div>` +
      (items.length ? `<table class="table"><thead><tr><th>id</th><th>来源</th><th>标签</th><th>用过</th><th></th></tr></thead><tbody>` +
        items.map(it => `<tr><td class="mono">${esc(it.id)}</td><td>${esc(it.source||'')}</td>
          <td class="small">${esc((it.tags||[]).slice(0,8).join(' / '))}</td><td>${it.uses||0}</td>
          <td><button class="btn" data-send-sticker="${esc(it.id)}">发送</button></td></tr>`).join('') + '</tbody></table>'

      } catch (e) { toast(e.message, 'err'); }
    });
  } catch (e) { box.textContent = '加载失败：' + e.message; }
}

function fillRoomSelect(sel, allowEmpty) {
  if (!sel) return;
  const rooms = (App.S.rooms||[]).map(r => ({ id:r.roomId, name:r.roomName }));
  const extra = (App.bridgeRooms||[]).map(r => ({ id:r.roomId, name:r.name }));
  const seen = new Set(); const all = [];
  for (const r of rooms.concat(extra)) { if (!r.id || seen.has(r.id)) continue; seen.add(r.id); all.push(r); }
  const prev = sel.value;
  sel.innerHTML = (allowEmpty ? '<option value="">（不选）</option>' : '') +
    all.map(r => `<option value="${esc(r.id)}" title="${esc(r.id)}">${esc(r.name || r.id)}</option>`).join('') +
    '<option value="__manual">手动输入…</option>';
  // 选项重建后浏览器会尽量保留旧值；「手动输入…」在还没有群列表时是唯一选项，
  // 拉到群列表后必须让它回到第一个真实群，否则点「读取」会拿 __manual 去查。
  if (prev && prev !== '__manual' && Array.from(sel.options).some(o => o.value === prev)) sel.value = prev;
  else if (prev === '__manual' && all.length) sel.value = all[0].id;
  else if (!prev && all.length) sel.value = all[0].id;
}

/** 状态里还没有已知群时，现从桥拉一次群列表（只读）。 */
async function ensureBridgeRooms() {
  if (App.bridgeRooms && App.bridgeRooms.length) return App.bridgeRooms;
  try {
    const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'rooms' }) });
    App.bridgeRooms = j.result || [];
  } catch (e) { toast('拉群列表失败：' + e.message, 'err'); }
  return App.bridgeRooms;
}

/** 下拉框里的「手动输入…」→ 弹框；否则取选中值。 */
function roomFrom(sel) {
  if (!sel) return '';
  if (sel.value === '__manual') return (prompt('输入群名或 roomId：') || '').trim();
  return sel.value;
}

      App.eyesInst = null;
      if (uploadMsg) uploadMsg.textContent = '';
      toast(App.eyesPkg && App.eyesPkg.usable ? '预检通过，可以安装' : '预检不通过（看下面的原因）', App.eyesPkg && App.eyesPkg.usable ? 'ok' : 'err');
      renderEyes();
    } catch (err) {
      if (uploadMsg) uploadMsg.textContent = '上传失败：' + err.message;
      toast('上传失败：' + err.message, 'err');
    }
  };
  if (drop) {
    drop.ondragover = (ev) => { ev.preventDefault(); drop.style.background = 'rgba(120,180,255,.08)'; drop.style.borderColor = 'var(--ok)'; };
    drop.ondragleave = () => { drop.style.background = ''; drop.style.borderColor = pkg ? 'var(--ok)' : 'var(--line)'; };
    drop.ondrop = (ev) => {
      ev.preventDefault();
      drop.style.background = ''; drop.style.borderColor = pkg ? 'var(--ok)' : 'var(--line)';
      const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
      void doUpload(f);
    };
    drop.onclick = () => { if (fileInput) fileInput.click(); };
  }
  if (fileInput) fileInput.onchange = () => { void doUpload(fileInput.files && fileInput.files[0]); };

  // ── 安装 ──
  const instBtn = $('#eyes-install');
  if (instBtn) instBtn.onclick = async () => {
    instBtn.disabled = true; instBtn.textContent = '安装中…';
    const msg = $('#eyes-install-msg');
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'eyesInstall' }) });
      const r = (j && j.result) || {};
      if (r.ok) {
        App.eyesInst = r; App.eyesPkg = null; App.eyes = null;
        toast('安装完成，启动微信即可', 'ok');
        renderEyes();
      } else {
        msg.textContent = r.error || '安装失败';
        if (r.needExit) msg.textContent += '\n\n退出微信后，再点一次「安装到微信目录」。';
        toast(r.error || '安装失败', 'err');
      }
    } catch (err) { msg.textContent = err.message; toast('安装失败：' + err.message, 'err'); }
    finally { if (instBtn) { instBtn.disabled = false; instBtn.textContent = '安装到微信目录'; } }
  };
  const after = $('#eyes-after');
  if (after) after.onclick = () => { App.eyesInst = null; App.eyes = null; renderEyes(); };

  // ── 目录 / 开关 ──
  const save = $('#eyes-save');
  if (save) save.onclick = async () => {
    const dir = $('#eyes-dir').value.trim();
    if (!dir) return toast('目录不能为空', 'err');
    try {
      await api('/action', { method: 'POST', body: JSON.stringify({ op: 'eyesSetDir', args: { dir } }) });
      toast('已保存：' + dir, 'ok'); App.eyes = null; setTimeout(renderEyes, 200);
    } catch (err) { toast('保存失败：' + err.message, 'err'); }
  };
  const clean = $('#eyes-clean');
  if (clean) clean.onclick = async () => {
    if (!confirm('清空重放目录里的缓存文件？')) return;
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'eyesClean' }) });
      toast('已清理 ' + ((j.result && j.result.removed) || 0) + ' 个文件', 'ok');
      App.eyes = null; setTimeout(renderEyes, 200);
    } catch (err) { toast('清理失败：' + err.message, 'err'); }
  };
  const on = $('#eyes-on');
  if (on) on.onchange = async (ev) => {
    try {
      await api('/action', { method: 'POST', body: JSON.stringify({ op: 'eyesToggle', args: { on: ev.target.checked } }) });
      toast(ev.target.checked ? '重放已开启' : '重放已关闭', 'ok'); App.eyes = null; setTimeout(renderEyes, 300);
    } catch (err) { toast('切换失败：' + err.message, 'err'); ev.target.checked = !ev.target.checked; }
  };
  const ref = $('#eyes-refresh');
  if (ref) ref.onclick = () => { App.eyes = null; renderEyes(); };
}


/* ── 更新（自动检查 GitHub main 分支）────────────────────── */
function renderUpdate() {
  if (!App.updInfo) {
    api('/action', { method: 'POST', body: JSON.stringify({ op: 'updateInfo' }) })
      .then(j => { App.updInfo = (j && j.result) || {}; if (App.tab === 'update') renderActive({}); })
      .catch(() => { App.updInfo = {} })
  }
  if (!App.upd) {
    api('/action', { method: 'POST', body: JSON.stringify({ op: 'checkUpdate' }) })
      .then(j => { App.upd = (j && j.result) || null; if (App.tab === 'update') renderActive({}); })
      .catch(() => {})
  }
  const u = App.upd || null;
  const info = App.updInfo || {};
  const has = u && u.available;
  view.innerHTML = `<h2>更新 <span class="muted small">从 GitHub 拉最新代码</span></h2>

    <div class="section"><div class="hd">📦 版本</div>
      <table class="table"><tbody>
        <tr><td class="muted">本地</td><td class="mono"><b>${esc('v' + ((u && u.localVersion) || info.version || '?'))}</b></td></tr>
        <tr><td class="muted">仓库最新</td><td class="mono"><b>${esc('v' + ((u && u.remoteVersion) || (info.latest && info.latest.version) || '?'))}</b></td></tr>
        <tr><td class="muted">发布说明</td><td>${esc((u && u.notes) || (info.latest && info.latest.notes) || '—')}</td></tr>
        <tr><td class="muted">仓库</td><td class="mono">${esc(info.repo || u && u.repo || '')}</td></tr>
        <tr><td class="muted">上次检查</td><td>${(u && u.checkedAt) || info.checkedAt ? esc(ago((u && u.checkedAt) || info.checkedAt)) : '从未'}</td></tr>
      </tbody></table>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="upd-check">检查更新</button>
        <span id="upd-msg" class="small"></span>
      </div>
      <div class="small muted" style="margin-top:8px">版本号只在「发版」时才升 —— 开发过程中改代码、提交都不会提示更新。</div>
    </div>
    </div>

    ${has ? `<div class="section" style="border:1px solid var(--warn)"><div class="hd">🆕 发现新版本
        <span class="muted">${esc((u.remoteShort || '') + ' · ' + (u.behind || 0) + ' 个提交')}</span></div>
      <div class="small" style="max-height:240px;overflow:auto;margin:6px 0">
        ${(u.commits && u.commits.length) ? u.commits.map(c => `<div style="padding:4px 0;border-bottom:1px dashed var(--line)">
          <span class="mono muted">${esc(c.sha)}</span> ${esc(c.msg)}</div>`).join('') : '<div class="empty">（没拿到提交列表）</div>'}
      </div>
      <div class="row">
        <button class="btn primary" id="upd-apply">立即更新</button>
        <span class="muted small">会先备份当前代码到 backups/；失败自动回滚</span>
      </div>
      <div id="upd-steps" class="small mono" style="margin-top:8px;white-space:pre-wrap"></div>
    </div>` : `<div class="section"><div class="hd">✅ 已是最新</div>
      <div class="small muted">${u ? '远程与本地一致。' : '还没检查过，点上面的「检查更新」。'}</div>
    </div>`}

    <div class="section"><div class="hd">🕘 更新历史</div>
      ${(info.history && info.history.length) ? info.history.map(h => `<div style="padding:3px 0" class="small">
        <span class="muted">${esc(fmtTime(h.at))}</span> <span class="mono">${esc(h.from)}</span> → <span class="mono">${esc(h.to)}</span></div>`).join('') : '<div class="empty">还没有更新记录</div>'}
    </div>

    <div class="section"><div class="hd">ℹ️ 说明</div>
      <div class="small muted">
        · 每天自动检查一次（插件启动 40 秒后先查一次）<br>
        · 只覆盖代码：插件 lib/、面板 panel/、桥 lib/、桥入口 *.mjs、scripts/<br>
        · <b>绝不碰</b> config.json / data/ / facts/ / memory/ / node_modules/<br>
        · 更新后：面板刷新即生效；桥会自动重启；<b>插件代码需要重启 DSH</b> 才加载
      </div>
    </div>`;

  $('#upd-check').onclick = async () => {
    const btn = $('#upd-check'); btn.disabled = true; btn.textContent = '检查中…';
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'checkUpdate' }) });
      App.upd = j.result || {};
      toast(App.upd.available ? '发现新版本' : '已是最新', 'ok');
      renderUpdate();
    } catch (e) { toast('检查失败：' + e.message, 'err'); $('#upd-msg').textContent = e.message; }
    finally { if (btn) { btn.disabled = false; btn.textContent = '检查更新'; } }
  };
  const apply = $('#upd-apply');
  if (apply) apply.onclick = async () => {
    if (!confirm('更新会覆盖插件/面板/桥的代码（config/data 不受影响），继续？')) return;
    const btn = apply; btn.disabled = true; btn.textContent = '更新中…';
    const out = $('#upd-steps');
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'applyUpdate' }) });
      const r = j.result || {};
      out.textContent = (r.steps || []).map(s => (s.ok ? '✓ ' : '✗ ') + s.step + (s.detail ? '  ' + s.detail : '')).join('\n');
      if (r.ok) {
        toast('更新完成！' + (r.hint || ''), 'ok');
        out.textContent += '\n\n' + (r.hint || '') + '\n建议刷新页面。';
        App.upd = null;
      } else {
        toast('更新失败：' + (r.error || '?') + (r.rolledBack ? '（已回滚）' : ''), 'err');
        out.textContent += '\n\n✗ ' + (r.error || '') + (r.rolledBack ? '\n（已自动回滚到备份）' : '\n⚠ 未能自动回滚，备份在 ' + (r.backup || ''));
      }
    } catch (e) { toast('更新失败：' + e.message, 'err'); out.textContent = e.message; }
    finally { if (btn) { btn.disabled = false; btn.textContent = '立即更新'; } }
  };
}

/* ── 诊断（崩溃 / 数据库 / 眼睛 / 磁盘 / 路由）────────────── */
function renderDiag() {
  view.innerHTML = `<h2>诊断 <span class="muted small">环境与链路体检</span></h2>
    <div class="row" style="margin-bottom:10px">
      <button class="btn primary" id="diag-refresh">重新检测</button>
      <span class="muted small" id="diag-at">${App.diag ? esc(ago(App.diagAt)) : '加载中…'}</span>
      <span class="muted small">（要连 hook 的三个端点，最慢约 6 秒）</span>
    </div>
    <div id="diag-body"><div class="empty">检测中…</div></div>`;

  const draw = () => {
    const d = App.diag || {};
    const body = $('#diag-body');
    if (!body) return;
    $('#diag-at').textContent = esc(ago(App.diagAt));
    if (d.error) { body.innerHTML = '<div class="card">诊断失败：' + esc(d.error) + '</div>'; return; }

    const c = d.crash || {};
    const db = d.db || {};
    const reg = db.registry || {};
    const cn = db.counters || {};
    const api = d.api || {};
    const slots = api.slots || {};
    const hk = d.hook || {};
    const hr = d.hires || {};
    const dk = d.disk || {};
    const llm = d.llm || {};

    const row = (k, v, bad) => `<tr><td class="muted">${esc(k)}</td><td class="mono" style="${bad ? 'color:var(--warn)' : ''}">${esc(v)}</td></tr>`;

    body.innerHTML = `
      <div class="section"><div class="hd">🛑 客户端崩溃（crashinfo）</div>
        ${c.error ? '<div class="empty">读不到：' + esc(c.error) + '</div>' : `
        <table class="table"><tbody>
          ${row('今天', (c.today || 0) + ' 次', c.today > 0)}
          ${row('昨天', (c.yesterday || 0) + ' 次')}
          ${row('累计 dump', (c.total || 0) + ' 个')}
          ${row('最近一次', c.lastAt ? fmtTime(c.lastAt) + '（' + ago(c.lastAt) + '，' + (c.lastMB||0) + 'MB）' : '无', c.today > 0)}
        </tbody></table>
        ${(c.recent && c.recent.length) ? '<div class="small muted" style="margin-top:6px">最近 5 次：' + c.recent.map(x => fmtTime(x.at) + '(' + x.mb + 'MB)').join(' · ') + '</div>' : ''}
        <div class="small muted" style="margin-top:6px">目录：${esc(c.dir || '')}</div>`}
      </div>

      <div class="section"><div class="hd">🗄 数据库句柄 <span class="muted">hook 的 /Debug/DBRescan</span></div>
        ${db.error ? '<div class="empty">读不到：' + esc(db.error) + '</div>' : `
        <table class="table"><tbody>
          ${row('hooks', 'prepare=' + (db.hooks && db.hooks.prepare) + ' / open_v2=' + (db.hooks && db.hooks.open_v2))}
          ${row('句柄登记', (reg.count || 0) + ' 个（有名 ' + (reg.named || 0) + ' / 无名 ' + (reg.unnamed || 0) + '）', (reg.count || 0) > 0 && (reg.named || 0) === 0)}
          ${row('缓存库数', (db.db_count || 0) + ' 个', (db.db_count || 0) === 0)}
          ${row('按名查找', '命中 ' + (cn.lookup_ok || 0) + ' / 总 ' + (cn.lookup_total || 0) + '（注册表 ' + (cn.lookup_registry||0) + '·缓存 ' + (cn.lookup_cache||0) + '·miss ' + (cn.lookup_miss||0) + '）', (cn.lookup_ok || 0) === 0)}
          ${row('查询', '成功 ' + (cn.query_ok || 0) + ' / 失败 ' + (cn.query_fail || 0), (cn.query_fail || 0) > 0)}
          ${row('取名扫描', '执行 ' + ((db.name_pass && db.name_pass.runs) || 0) + ' 次（连续空扫 ' + ((db.name_pass && db.name_pass.consecutive_empty) || 0) + '）')}
        </tbody></table>
        ${(reg.entries && reg.entries.length) ? '<div class="small muted" style="margin-top:6px">前 5 条：' + reg.entries.slice(0,5).map(e => (e.db || '(无名)') + ' ← ' + (e.source || '?')).join(' · ') + '</div>' : ''}`}
      </div>

      <div class="section"><div class="hd">🔧 SQLite API 表 <span class="muted">hook 的 /Debug/ApiTable</span></div>
        ${api.error ? '<div class="empty">读不到：' + esc(api.error) + '</div>' : `
        <div class="small muted" style="margin-bottom:6px">api_table = ${esc(api.api_table || '?')}　module = ${esc(api.module_base || '?')}（${api.module_size ? Math.round(api.module_size/1048576) + 'MB' : '?'}）</div>
        <table class="table"><thead><tr><th>槽位</th><th>地址</th><th>null</th><th>在模块内</th><th>可读</th></tr></thead><tbody>
          ${Object.keys(slots).map(k => { const s = slots[k] || {}; const bad = s.is_null || !s.in_module;
            return '<tr><td>' + esc(k) + '</td><td class="mono">' + esc(s.addr || '') + '</td><td>' + (s.is_null ? '❌' : '✅') + '</td><td style="' + (bad ? 'color:var(--warn)' : '') + '">' + (s.in_module ? '✅' : '❌') + '</td><td>' + (s.readable ? '✅' : '❌') + '</td></tr>'; }).join('')}
        </tbody></table>`}
      </div>

      <div class="section"><div class="hd">👁 眼睛（高分辨率 media provider）</div>
        ${hr.error ? '<div class="empty">读不到：' + esc(hr.error) + '</div>' : `
        <table class="table"><tbody>
          ${row('目录', hr.dir || '')}
          ${row('文件数', String(hr.count || 0), (hr.count || 0) === 0)}
          ${row('占用', (hr.mb || 0) + ' MB')}
          ${row('最近写入', hr.newestAt ? fmtTime(hr.newestAt) + '（' + ago(hr.newestAt) + '）' : '无')}
        </tbody></table>
        <div class="row" style="margin-top:8px"><button class="btn" id="diag-hires-clean">清理该目录</button>
          <span class="muted small">只删本机缓存的原图/整片，不影响微信</span></div>`}
      </div>

      <div class="section"><div class="hd">💾 磁盘 / 路由</div>
        ${dk.error ? '<div class="empty">' + esc(dk.error) + '</div>' : `
        <table class="table"><tbody>
          ${row('配置', (dk.configKB || 0) + ' KB')}
          ${row('用量记录', (dk.usageKB || 0) + ' KB')}
          ${row('群成员', (dk.membersKB || 0) + ' KB')}
          ${row('记忆目录', (dk.memoryMB || 0) + ' MB')}
        </tbody></table>`}
        <table class="table" style="margin-top:10px"><tbody>
          ${row('LLM 路由', (llm.provider || '(空)') + ' / ' + (llm.model || '(空)'), !llm.explicit)}
          ${llm.explicit ? '' : '<tr><td colspan="2" style="color:var(--warn)">⚠ 「聊天 provider/model」为空 —— DSH 路由缺失时会直接抛「无法确定 LLM 路由」，表现为完全不回话。请到「模型接口」页的当前路由里选定服务商/模型。</td></tr>'}
          ${row('视觉', (llm.visionProvider || '(同聊天)') + ' / ' + (llm.visionModel || '(未设)'))}
          ${row('上次实际路由', llm.lastRoute ? (llm.lastRoute.provider || '') + ' / ' + (llm.lastRoute.model || '') : '—')}
        </tbody></table>
      </div>

      <div class="section"><div class="hd">🔌 hook 进程状态</div>
        ${hk.error ? '<div class="empty">' + esc(hk.error) + '</div>' : `
        <table class="table"><tbody>
          ${row('IsLogin', String(hk.IsLogin), !hk.IsLogin)}
          ${row('模块基址', '0x' + Number(hk.base || 0).toString(16).toUpperCase())}
          ${row('模块大小', hk.module_size ? Math.round(hk.module_size/1048576) + ' MB' : '0（未取到）', !hk.module_size)}
          ${row('库数量', String(hk.dbs || 0), (hk.dbs || 0) === 0)}
          ${row('API 指针在模块内', String(hk.api_ptrs_in_module ?? '?'))}
        </tbody></table>`}
      </div>`;

    $('#diag-refresh').onclick = () => { App.diag = null; renderDiag(); };
    const clean = $('#diag-hires-clean');
    if (clean) clean.onclick = async () => {
      if (!confirm('清空 hires 目录里的缓存文件？（原图/整片视频，删了微信下次会重新下）')) return;
      try {
        await api('/action', { method: 'POST', body: JSON.stringify({ op: 'diagCleanHires' }) });
        toast('已清理', 'ok');
        App.diag = null; renderDiag();
      } catch (e) { toast('清理失败：' + e.message, 'err'); }
    };
  };

  loadDiag(true).then(() => draw());
}

/* ── 手动操作 ─────────────────────────────────────────── */
function renderManual() {
  view.innerHTML = `<h2>手动操作</h2>
    <div class="section"><div class="hd">🕹 以机器人身份发一条</div>
      <div class="field"><div class="lab">操作</div><div class="ctl">
        <select id="op"><option value="sendText">发文字</option><option value="sayVoice">发语音（合成）</option>
          <option value="sendSticker">发表情包</option><option value="pat">拍一拍</option></select></div></div>
      <div class="field"><div class="lab">群</div><div class="ctl"><select id="op-room" style="min-width:240px"></select>
        <input id="op-room-manual" type="text" placeholder="或手输群名/roomId" style="flex:1;min-width:160px"></div></div>
      <div class="field"><div class="lab">内容</div><div class="ctl"><textarea id="op-text" placeholder="文字；发表情包时填 stickerId 或语境；拍一拍时填 wxid"></textarea></div></div>
      <div class="field" id="row-emotion" style="display:none"><div class="lab">音色</div><div class="ctl">
        <select id="op-emotion"><option>main</option><option>sweet</option><option>angry</option><option>serious</option></select></div></div>
      <div class="field" id="row-sticker" style="display:none"><div class="lab">附带表情包</div><div class="ctl">
        <label class="hswitch">发送后再补一张 <span class="sw"><input type="checkbox" id="op-sticker"><i></i></span></label></div></div>
      <div class="row"><button class="btn primary" id="btn-send">发送</button>
        <span class="muted small">发送会真的进群，先用小号群试。</span></div>
      <div id="op-result" class="small mono" style="margin-top:10px"></div></div>

    <div class="section"><div class="hd">🔎 查历史 / 最近消息</div>
      <div class="row"><input id="q" type="text" placeholder="关键词（搜微信历史）" style="flex:1;min-width:200px">
        <select id="q-room" style="min-width:200px"></select>
        <button class="btn" id="btn-search">搜索</button>
        <button class="btn" id="btn-history">看最近</button></div>
      <div id="q-result" class="small" style="margin-top:10px"></div></div>`;

  fillRoomSelect($('#op-room'), true);
  fillRoomSelect($('#q-room'), true);
  ensureBridgeRooms().then(() => { fillRoomSelect($('#op-room'), true); fillRoomSelect($('#q-room'), true); });
  $('#op').onchange = () => {
    const op = $('#op').value;
    $('#row-emotion').style.display = op === 'sayVoice' ? '' : 'none';
    $('#row-sticker').style.display = op === 'sendText' ? '' : 'none';
  };
  $('#btn-send').onclick = async () => {
    const op = $('#op').value;
    const room = $('#op-room-manual').value.trim() || $('#op-room').value;
    const text = $('#op-text').value;
    if (room === '__manual') return toast('请在右侧手输群名/roomId', 'err');
    if (!text.trim()) return toast('内容不能为空', 'err');
    if (!confirm('确认以机器人身份发送到群？')) return;
    $('#btn-send').disabled = true;
    try {
      let args = { room, text };
      if (op === 'sendText') args.sticker = $('#op-sticker').checked;
      if (op === 'sayVoice') args.emotion = $('#op-emotion').value;
      if (op === 'sendSticker') { args = { room }; if (/^\w{6,}$/.test(text.trim()) && text.trim().length < 40) args.stickerId = text.trim(); else args.text = text.trim(); }
      if (op === 'pat') args = { room, wxid: text.trim() };
      const j = await api('/action', { method:'POST', body: JSON.stringify({ op, args }) });
      $('#op-result').textContent = JSON.stringify(j.result, null, 1);
      toast('已执行', 'ok');
    } catch (e) { toast('失败：' + e.message, 'err'); $('#op-result').textContent = e.message; }
    finally { $('#btn-send').disabled = false; }
  };
  $('#btn-search').onclick = async () => {
    const room = roomFrom($('#q-room')), query = $('#q').value.trim();
    try {
      const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'searchMessages', args:{ room, query, limit: 30 } }) });
      const items = (j.result && j.result.items) || [];
      $('#q-result').innerHTML = items.length ? items.map(it => `<div style="padding:3px 0"><span class="muted small">${esc(fmtTime(it.ts))}</span> <b>${esc(it.senderName||it.sender||'')}</b> ${esc(it.text)}</div>`).join('') : '<div class="empty">没有结果</div>';
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#btn-history').onclick = async () => {
    const room = roomFrom($('#q-room'));
    try {
      const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'history', args:{ room, limit: 30 } }) });
      const items = (j.result && (j.result.items || j.result)) || [];
      $('#q-result').innerHTML = Array.isArray(items) && items.length ? items.map(it => `<div style="padding:3px 0"><span class="muted small">${esc(fmtTime(it.ts))}</span> <b>${esc(it.isSelf?'我':(it.senderName||it.sender||''))}</b> ${esc(it.text)}</div>`).join('') : '<div class="empty">没有记录</div>';
    } catch (e) { toast(e.message, 'err'); }
  };
}

/* ── 启动 ─────────────────────────────────────────────── */
$('#m-enabled').onchange = async (e) => {
  const on = e.target.checked;
  if (!on && !confirm('停用机器人？\n\n停用后仍会收消息、记记忆，但不回复、不主动发言。')) { e.target.checked = true; return; }
  try {
    await api('/config', { method:'POST', body: JSON.stringify({ patch:{ enabled:on } }) });
    App.S.config.enabled = on; toast(on ? '机器人已启用' : '机器人已停用', on ? 'ok' : 'err'); renderHeader();
  } catch (err) { e.target.checked = !on; toast(err.message, 'err'); }
};
$('#m-dry').onchange = async (e) => {
  const on = e.target.checked;
  try {
    await api('/config', { method:'POST', body: JSON.stringify({ patch:{ dryRun:on } }) });
    App.S.config.dryRun = on; toast(on ? '演练模式：不发送' : '已退出演练模式', 'ok'); renderHeader();
  } catch (err) { e.target.checked = !on; toast(err.message, 'err'); }
};

renderNav();
refresh();
setInterval(() => refresh({ lite:true }), 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh({ lite:true }); });
</script>
</body>
</html>
