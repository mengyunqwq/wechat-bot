/* ── 更新（自动检查 GitHub main 分支）────────────────────── */
function renderUpdate() {
  if (!App.updInfo) {
    api('/action', { method: 'POST', body: JSON.stringify({ op: 'updateInfo' }) })
      .then(j => { App.updInfo = (j && j.result) || {}; if (App.tab === 'update') renderActive({}); })
      .catch(() => { App.updInfo = {} })
  }
  if (!App.upd) {
    // ★ 不再每次进页面都打 GitHub API：匿名限额只有 60 次/小时，刷新几次就烧光，
    //   烧光后 403 → 退到 jsDelivr → 读到陈旧版本（用户看到「仓库最新」倒退）。
    //   10 分钟内直接用上次检查的缓存，点「检查更新」才强制查。
    const i0 = App.updInfo || {};
    const fresh = Date.now() - (i0.checkedAt || 0) < 10 * 60 * 1000;
    if (fresh && i0.latest) {
      App.upd = { available: false, cached: true, remoteVersion: i0.latest.version, notes: i0.latest.notes, localVersion: i0.version, checkedAt: i0.checkedAt };
    } else {
      api('/action', { method: 'POST', body: JSON.stringify({ op: 'checkUpdate' }) })
        .then(j => { App.upd = (j && j.result) || null; if (App.tab === 'update') renderActive({}); })
        .catch(() => {})
    }
  }
  const u = App.upd || null;
  const info = App.updInfo || {};
  const has = u && u.available;
  // ★ 仓库版本取「本次检查结果」与「上次成功缓存」里更大的那个：
  //   CDN 节点不同步时本次可能读回旧值，不能让它把已经确认过的新版本盖回去。
  const cmpV = (a, b) => {
    const pa = String(a || '').replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
    const pb = String(b || '').replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      const x = pa[i] || 0, y = pb[i] || 0;
      if (x !== y) return x > y ? 1 : -1;
    }
    return 0;
  };
  const localV = info.version || (u && u.localVersion) || '';
  const remoteCands = [u && u.remoteVersion, info.latest && info.latest.version].filter(Boolean);
  let remoteV = remoteCands[0] || '';
  for (const c of remoteCands) if (cmpV(c, remoteV) > 0) remoteV = c;
  const staleHint = localV && remoteV && cmpV(remoteV, localV) < 0
    ? ' <span class="small muted">（CDN 缓存滞后，实际不旧于本地）</span>' : '';
  view.innerHTML = `<h2>更新 <span class="muted small">从 GitHub 拉最新代码</span></h2>

    <div class="section"><div class="hd">📦 版本</div>
      <table class="table"><tbody>
        <tr><td class="muted">本地</td><td class="mono"><b title="${esc((info.versionFile || '') + (info.botHome ? '｜项目根：' + info.botHome : ''))}">${esc('v' + (info.version || (u && u.localVersion) || '?'))}</b>${info.versionErrors && info.versionErrors.length ? ` <span class="small muted">（${esc(info.versionErrors[0])}）</span>` : ''}</td></tr>
        <tr><td class="muted">仓库最新</td><td class="mono"><b>${esc('v' + (remoteV || '?'))}</b>${staleHint}</td></tr>
        <tr><td class="muted">发布说明</td><td>${esc((u && u.notes) || (info.latest && info.latest.notes) || '—')}</td></tr>
        <tr><td class="muted">仓库</td><td class="mono">${esc(info.repo || u && u.repo || '')}${u && u.source ? ` <span class="small muted">（来源：${esc(u.source)}）</span>` : ''}</td></tr>
        <tr><td class="muted">上次检查</td><td>${(u && u.checkedAt) || info.checkedAt ? esc(ago((u && u.checkedAt) || info.checkedAt)) : '从未'}</td></tr>
      </tbody></table>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="upd-check">检查更新</button>
        <span id="upd-msg" class="small"></span>
      </div>
      <div class="small muted" style="margin-top:8px">版本号只在「发版」时才升 —— 开发过程中改代码、提交都不会提示更新。</div>
    </div>

    <div class="section"><div class="hd">🌐 自定义版本源 <span class="muted">不依赖 GitHub API</span></div>
      <div class="small muted">填一个直接返回 <span class="mono">{"version":"1.3.x"}</span> 的 URL（可填多个，逗号分隔）。适合自建对象存储 / 局域网共享 / 别的托管；这一档不受 GitHub 限额和 CDN 缓存影响。</div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="mirror-input" style="flex:1;min-width:260px" placeholder="https://example.com/wechat-bot/version.json" value="${esc((App.S && App.S.config && App.S.config.updateMirror) || '')}">
        <button class="btn primary" id="mirror-save">保存</button>
      </div>
    </div>
    </div>

    ${has ? `<div class="section" style="border:1px solid var(--warn)"><div class="hd">🆕 发现新版本
        <span class="muted">${esc((u.remoteShort || '') + ' · ' + (u.behind || 0) + ' 个提交')}</span></div>
      <div class="small" style="max-height:240px;overflow:auto;margin:6px 0">
        ${(u.commits && u.commits.length) ? u.commits.map(c => `<div style="padding:4px 0;border-bottom:1px dashed var(--line)">
          <span class="mono muted">${esc(c.sha)}</span> ${esc(c.msg)}</div>`).join('') : '<div class="empty">（没拿到提交列表）</div>'}
      </div>
      <div class="row">
        <button class="btn primary" id="upd-apply">立即更新</button>
        <span class="muted small">会先备份当前代码到 backups/；失败自动回滚</span>
      </div>
      <div id="upd-steps" class="small mono" style="margin-top:8px;white-space:pre-wrap"></div>
    </div>` : `<div class="section"><div class="hd">✅ 已是最新</div>
      <div class="small muted">${u ? '远程与本地一致。' : '还没检查过，点上面的「检查更新」。'}</div>
    </div>`}

    <div class="section"><div class="hd">🕘 更新历史</div>
      ${(info.history && info.history.length) ? info.history.map(h => `<div style="padding:3px 0" class="small">
        <span class="muted">${esc(fmtTime(h.at))}</span> <span class="mono">${esc(h.from)}</span> → <span class="mono">${esc(h.to)}</span></div>`).join('') : '<div class="empty">还没有更新记录</div>'}
    </div>

    <div class="section"><div class="hd">ℹ️ 说明</div>
      <div class="small muted">
        · 每天自动检查一次（插件启动 40 秒后先查一次）<br>
        · 只覆盖代码：插件 lib/、面板 panel/、桥 lib/、桥入口 *.mjs、scripts/、根 version.json<br>
        · <b>绝不碰</b> config.json / data/ / facts/ / memory/ / node_modules/<br>
        · 更新后：面板刷新即生效；桥会自动重启；<b>插件代码需要重启 DSH</b> 才加载
      </div>
    </div>`;

  // 自定义版本源：保存后立刻重查一次，让用户马上看到效果
  const mSave = $('#mirror-save');
  if (mSave) mSave.onclick = async () => {
    const inp = $('#mirror-input');
    const v = inp ? inp.value.trim() : '';
    try {
      await api('/config', { method: 'POST', body: JSON.stringify({ patch: { updateMirror: v } }) });
      if (App.S && App.S.config) App.S.config.updateMirror = v;
      App.upd = null;
      App.updInfo = null;
      toast(v ? '已保存，正在重新检查…' : '已清空自定义源', 'ok');
      renderUpdate();
    } catch (e) { toast('保存失败：' + e.message, 'err'); }
  };
  $('#upd-check').onclick = async () => {
    const btn = $('#upd-check'); btn.disabled = true; btn.textContent = '检查中…';
    try {
      // /action 只把 body.args 交给后端，force 写在顶层等于没传
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'checkUpdate', args: { force: true } }) });
      App.upd = j.result || {};
      toast(App.upd.available ? '发现新版本' : '已是最新', 'ok');
      renderUpdate();
    } catch (e) { toast('检查失败：' + e.message, 'err'); $('#upd-msg').textContent = e.message; }
    finally { if (btn) { btn.disabled = false; btn.textContent = '检查更新'; } }
  };
  const apply = $('#upd-apply');
  if (apply) apply.onclick = async () => {
    if (!confirm('更新会覆盖插件/面板/桥的代码（config/data 不受影响），继续？')) return;
    const btn = apply; btn.disabled = true; btn.textContent = '更新中…';
    const out = $('#upd-steps');
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'applyUpdate' }) });
      const r = j.result || {};
      out.textContent = (r.steps || []).map(s => (s.ok ? '✓ ' : '✗ ') + s.step + (s.detail ? '  ' + s.detail : '')).join('\n');
      if (r.ok) {
        toast('更新完成！' + (r.hint || ''), 'ok');
        out.textContent += '\n\n' + (r.hint || '') + '\n建议刷新页面。';
        App.upd = null;
      } else {
        toast('更新失败：' + (r.error || '?') + (r.rolledBack ? '（已回滚）' : ''), 'err');
        out.textContent += '\n\n✗ ' + (r.error || '') + (r.rolledBack ? '\n（已自动回滚到备份）' : '\n⚠ 未能自动回滚，备份在 ' + (r.backup || ''));
      }
    } catch (e) { toast('更新失败：' + e.message, 'err'); out.textContent = e.message; }
    finally { if (btn) { btn.disabled = false; btn.textContent = '立即更新'; } }
  };
}

/* ── 诊断（崩溃 / 数据库 / 磁盘 / 路由）────────────── */
async function renderMomentExtra() {
  const box = $('#moment-extra'); if (!box) return;
  box.innerHTML = `<div class="section"><div class="hd">📸 现在发一条 <span class="muted">手动 / 让 AI 现写</span></div>
    <div class="row" style="margin-bottom:8px">
      <button class="btn primary" id="moment-ai">🤖 让 AI 写一条并发布</button>
      <button class="btn" id="moment-ai-img">🖼 AI 写 + 配图发布</button>
      <button class="btn" id="moment-check">检查微信窗口</button>
      <button class="btn" id="moment-judge" title="拿最近群聊让 AI 判一次，只显示结果不发布">🔍 试评估</button>
      <span class="small muted" id="moment-st">读取状态…</span>
    </div>
    <textarea id="moment-text" rows="4" placeholder="或者自己写一条…（最多 1500 字）"
      style="width:100%;box-sizing:border-box;resize:vertical;font:inherit;padding:10px;border-radius:8px;border:1px solid #e5e5e5;color:inherit"></textarea>
    <div class="row" style="margin-top:8px;align-items:center">
      <button class="btn" id="moment-post">发布这条</button>
      <label class="hswitch" style="margin-left:6px">
        <input type="checkbox" id="moment-post-img">
        <span class="small">配图（图生图）</span>
      </label>
      <span class="small muted" id="moment-count">0 字</span>
    </div>
  </div>
  <div class="section" id="moment-judge-box" style="display:none"><div class="hd">🔍 试评估结果 <span class="muted">（不会发布）</span></div><div id="moment-judge-out" class="small"></div></div>
  <div class="section"><div class="hd">📈 发布记录</div><div id="moment-hist"><div class="empty">读取中…</div></div></div>`;

  const st = $('#moment-st');
  const ta = $('#moment-text');
  const cnt = $('#moment-count');
  const hist = $('#moment-hist');
  ta.oninput = () => { cnt.textContent = ta.value.length + ' 字' };

  const fmtGap = (ms) => {
    if (!ms) return '—';
    const m = Math.round(ms / 60000);
    if (m < 60) return m + ' 分钟';
    const h = m / 60;
    return (Number.isInteger(h) ? h : h.toFixed(1)) + ' 小时';
  };

  async function refresh() {
    try {
      const r = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'momentStatus', args: {} }) });
      const s2 = r.state || {};
      st.textContent = r.hookOk
        ? ('微信就绪' + (r.hasEditor ? '（编辑器里还有一份草稿）' : ''))
        : '⚠️ 微信主窗口被收起（托盘）——点开主窗口才能发朋友圈';
      const nextIn = s2.nextAt ? Math.max(0, s2.nextAt - Date.now()) : 0;
      const rows = [
        ['定时发布', r.auto ? '✅ 已开启' : '⏸ 已关闭'],
        ['群聊事件触发', r.fromChat
          ? ('✅ 开（门槛 ' + (r.chatMinScore || 7) + ' 分 · ' +
             ((r.chatRooms && r.chatRooms.length) ? (r.chatRooms.length + ' 个群') : '所有群') + '）')
          : '⏸ 关'],
        ['AI 写文案', r.useLLM ? '是' : '否（用内置句子）'],
        ['配图', r.autoImage
          ? ('✅ 开（' + (r.imageSource === 'char' ? '蓝色大肥鱼本人' : r.imageSource === 'ai' ? 'AI 文生图' : '网上随机动漫图') + '）')
          : '关（纯文字）'],
        ['间隔区间', fmtGap(r.minGapMs) + ' ~ ' + fmtGap(r.maxGapMs) + '（随机）'],
        ['每天上限', (r.dailyMax || 0) + ' 条'],
        ['允许时段', r.hours || '不限'],
        ['今日已发', (s2.todayCount || 0) + ' 条'],
        ['下次预计', r.auto ? (nextIn ? ('约 ' + fmtGap(nextIn) + '后') : '下一次检查时') : '—'],
        ['上次', s2.lastAt
          ? (fmtTime(s2.lastAt)
             + ' · ' + (s2.lastVerified ? '✅ 已发布' : (s2.lastErr ? '❌ ' + s2.lastErr : '—'))
             + (s2.lastTrigger === 'chat'
                ? (' ｜ 群聊触发 ' + (s2.lastScore ? s2.lastScore + ' 分' : '') + (s2.lastRoom ? ' · ' + s2.lastRoom : ''))
                : (s2.lastTrigger === 'schedule' ? ' ｜ 定时' : '')))
          : '还没发过'],
      ];
      hist.innerHTML = `<div class="list">${rows.map(([k, v]) =>
        `<div class="item"><span class="muted">${esc(k)}</span><span>${esc(String(v))}</span></div>`).join('')}
        ${s2.lastText ? `<div class="item"><span class="muted">上次文案</span><span>${esc(s2.lastText)}</span></div>` : ''}</div>`;
    } catch (e) {
      const msg = String(e.message || e);
      const needRestart = /不允许的操作/.test(msg);
      st.textContent = needRestart
        ? '⚠️ 插件代码是旧版本（页面已更新但插件没重载）'
        : ('状态读取失败：' + msg);
      hist.innerHTML = needRestart
        ? ('<div class="empty">👉 去「诊断」页点<b>热重载插件</b>，或重启 DSH（不是重启微信）<br>' +
           '<span class="muted small">' + esc(msg) + '</span></div>')
        : ('<div class="empty">状态读取失败：' + esc(msg) + '</div>');
    }
  }

  $('#moment-check').onclick = () => { st.textContent = '检查中…'; refresh() };

  $('#moment-judge').onclick = async () => {
    const btn = $('#moment-judge');
    const box = $('#moment-judge-box'), out = $('#moment-judge-out');
    btn.disabled = true; btn.textContent = '判定中…';
    try {
      const r = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'momentEvalTest', args: {} }) });
      box.style.display = '';
      if (!r.ok) { out.innerHTML = '<span style="color:#c00">' + esc(r.error || '失败') + '</span>'; return; }
      const v = r.verdict || {};
      const good = v.worthy && (v.score || 0) >= (r.threshold || 7);
      out.innerHTML =
        '<div><b>' + esc(r.room || '') + '</b> · 看 ' + r.messages + ' 条 · 门槛 ' + r.threshold + ' 分</div>' +
        '<div style="margin:6px 0;font-size:15px">' +
          (good ? '<span style="color:#0a0">✅ 值得发</span>' : '<span style="color:#888">⏸ 不值得</span>') +
          ' · 评分 <b>' + (v.score || 0) + '</b> / 10</div>' +
        (v.text ? '<div style="margin:6px 0;padding:8px 10px;background:#f6f6f8;border-radius:8px">文案：' + esc(v.text) + '</div>' : '') +
        (v.reason ? '<div class="muted">理由：' + esc(v.reason) + '</div>' : '') +
        '<div class="muted" style="margin-top:6px">本次是否会真的发：' + (r.wouldPost ? '会' : '不会') +
          (r.gate && !r.gate.ok ? '（' + esc(r.gate.why) + '）' : '') + '</div>';
    } catch (e) { toast('试评估失败：' + e.message, 'err') }
    finally { btn.disabled = false; btn.textContent = '🔍 试评估' }
  };

  $('#moment-ai').onclick = async () => {
    const btn = $('#moment-ai');
    btn.disabled = true; btn.textContent = 'AI 写作+发布中…';
    try {
      const r = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'momentNow', args: {} }) });
      if (r.ok) toast('已发布：' + String(r.text || '').slice(0, 30), 'ok');
      else toast('未发布：' + (r.error || ('ret=' + r.ret)), 'err');
    } catch (e) { toast('失败：' + e.message, 'err') }
    finally { btn.disabled = false; btn.textContent = '🤖 让 AI 写一条并发布'; refresh() }
  };

  $('#moment-ai-img').onclick = async () => {
    const btn = $('#moment-ai-img');
    btn.disabled = true; btn.textContent = '生图 + 发布中…（约 20 秒）';
    try {
      const r = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'momentNow', args: { image: true } }) });
      if (r.ok) {
        toast(r.withImage
          ? ('已发布（带图）：' + String(r.text || '').slice(0, 24))
          : ('已发布（纯文字，配图失败）：' + String(r.text || '').slice(0, 20)), r.withImage ? 'ok' : 'err');
      } else toast('未发布：' + (r.error || ('ret=' + r.ret)), 'err');
    } catch (e) { toast('失败：' + e.message, 'err') }
    finally { btn.disabled = false; btn.textContent = '🖼 AI 写 + 配图发布'; refresh() }
  };

  $('#moment-post').onclick = async () => {
    const text = ta.value.trim();
    if (!text) return toast('先写点内容', 'err');
    const withImg = !!$('#moment-post-img')?.checked;
    const btn = $('#moment-post');
    btn.disabled = true; btn.textContent = withImg ? '生成配图中…（约 25 秒）' : '发布中…';
    try {
      const r = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'postMoment', args: { text, image: withImg } }) });
      if (r.ok) {
        if (withImg && !r.withImage) toast('已发布，但配图没生成（已按纯文字发出）：' + (r.imageError || '配图失败'), 'err');
        else toast(r.withImage ? '已发布（带图）' : '已发布', 'ok');
        ta.value = ''; cnt.textContent = '0 字';
      } else toast('失败：' + (r.error || ('ret=' + r.ret)), 'err');
    } catch (e) { toast('失败：' + e.message, 'err') }
    finally { btn.disabled = false; btn.textContent = '发布这条'; refresh() }
  };

  refresh();
}

function renderDiag() {
  view.innerHTML = `<h2>诊断 <span class="muted small">环境与链路体检</span></h2>
    <div class="row" style="margin-bottom:10px">
      <button class="btn primary" id="diag-refresh">重新检测</button>
      <button class="btn" id="diag-poll">恢复轮询</button>
      <button class="btn" id="diag-reload" title="重新加载 lib/index.js —— 改完插件代码不用重启 DSH">热重载插件</button>
      <button class="btn" id="diag-wx-status" title="查询微信进程状态（wechatPower.status）">微信状态</button>
      <button class="btn" id="diag-wx-start" title="启动微信并自动点「进入微信」（wechatPower.start）">启动微信</button>
      <button class="btn" id="diag-hires-clean" title="清空 hires 缓存目录（原图/整片视频，删了微信会重新下）">清空 hires 缓存</button>
      <span class="muted small" id="diag-wx-st"></span>
      <span class="muted small" id="diag-poll-st">轮询状态读取中…</span>
      <span class="muted small" id="diag-at">${App.diag ? esc(ago(App.diagAt)) : '加载中…'}</span>
      <span class="muted small">（要连 hook 的三个端点，最慢约 6 秒）</span>
    </div>
    <div id="diag-body"><div class="empty">检测中…</div></div>`;

  const draw = () => {
    const d = App.diag || {};
    const body = $('#diag-body');
    if (!body) return;
    $('#diag-at').textContent = esc(ago(App.diagAt));
    if (d.error) { body.innerHTML = '<div class="card">诊断失败：' + esc(d.error) + '</div>'; return; }

    const c = d.crash || {};
    const db = d.db || {};
    const reg = db.registry || {};
    const cn = db.counters || {};
    const api = d.api || {};
    const slots = api.slots || {};
    const hk = d.hook || {};
    const hr = d.hires || {};
    const dk = d.disk || {};
    const llm = d.llm || {};

    const row = (k, v, bad) => `<tr><td class="muted">${esc(k)}</td><td class="mono" style="${bad ? 'color:var(--warn)' : ''}">${esc(v)}</td></tr>`;

    body.innerHTML = `
      <div class="section"><div class="hd">🛑 客户端崩溃（crashinfo）</div>
        ${c.error ? '<div class="empty">读不到：' + esc(c.error) + '</div>' : `
        <table class="table"><tbody>
          ${row('今天', (c.today || 0) + ' 次', c.today > 0)}
          ${row('昨天', (c.yesterday || 0) + ' 次')}
          ${row('累计 dump', (c.total || 0) + ' 个')}
          ${row('最近一次', c.lastAt ? fmtTime(c.lastAt) + '（' + ago(c.lastAt) + '，' + (c.lastMB||0) + 'MB）' : '无', c.today > 0)}
        </tbody></table>
        ${(c.recent && c.recent.length) ? '<div class="small muted" style="margin-top:6px">最近 5 次：' + c.recent.map(x => fmtTime(x.at) + '(' + x.mb + 'MB)').join(' · ') + '</div>' : ''}
        <div class="small muted" style="margin-top:6px">目录：${esc(c.dir || '')}</div>`}
      </div>

      <div class="section"><div class="hd">🗄 数据库句柄 <span class="muted">hook 的 /Debug/DBRescan</span></div>
        ${db.error ? '<div class="empty">读不到：' + esc(db.error) + '</div>' : `
        <table class="table"><tbody>
          ${row('hooks', 'prepare=' + (db.hooks && db.hooks.prepare) + ' / open_v2=' + (db.hooks && db.hooks.open_v2))}
          ${row('句柄登记', (reg.count || 0) + ' 个（有名 ' + (reg.named || 0) + ' / 无名 ' + (reg.unnamed || 0) + '）', (reg.count || 0) > 0 && (reg.named || 0) === 0)}
          ${row('缓存库数', (db.db_count || 0) + ' 个', (db.db_count || 0) === 0)}
          ${row('按名查找', '命中 ' + (cn.lookup_ok || 0) + ' / 总 ' + (cn.lookup_total || 0) + '（注册表 ' + (cn.lookup_registry||0) + '·缓存 ' + (cn.lookup_cache||0) + '·miss ' + (cn.lookup_miss||0) + '）', (cn.lookup_ok || 0) === 0)}
          ${row('查询', '成功 ' + (cn.query_ok || 0) + ' / 失败 ' + (cn.query_fail || 0), (cn.query_fail || 0) > 0)}
          ${row('取名扫描', '执行 ' + ((db.name_pass && db.name_pass.runs) || 0) + ' 次（连续空扫 ' + ((db.name_pass && db.name_pass.consecutive_empty) || 0) + '）')}
        </tbody></table>
        ${(reg.entries && reg.entries.length) ? '<div class="small muted" style="margin-top:6px">前 5 条：' + reg.entries.slice(0,5).map(e => (e.db || '(无名)') + ' ← ' + (e.source || '?')).join(' · ') + '</div>' : ''}`}
      </div>

      <div class="section"><div class="hd">🔧 SQLite API 表 <span class="muted">hook 的 /Debug/ApiTable</span></div>
        ${api.error ? '<div class="empty">读不到：' + esc(api.error) + '</div>' : `
        <div class="small muted" style="margin-bottom:6px">api_table = ${esc(api.api_table || '?')}　module = ${esc(api.module_base || '?')}（${api.module_size ? Math.round(api.module_size/1048576) + 'MB' : '?'}）</div>
        <table class="table"><thead><tr><th>槽位</th><th>地址</th><th>null</th><th>在模块内</th><th>可读</th></tr></thead><tbody>
          ${Object.keys(slots).map(k => { const s = slots[k] || {}; const bad = s.is_null || !s.in_module;
            return '<tr><td>' + esc(k) + '</td><td class="mono">' + esc(s.addr || '') + '</td><td>' + (s.is_null ? '❌' : '✅') + '</td><td style="' + (bad ? 'color:var(--warn)' : '') + '">' + (s.in_module ? '✅' : '❌') + '</td><td>' + (s.readable ? '✅' : '❌') + '</td></tr>'; }).join('')}
        </tbody></table>`}
      </div>


      <div class="section"><div class="hd">💾 磁盘 / 路由</div>
        ${dk.error ? '<div class="empty">' + esc(dk.error) + '</div>' : `
        <table class="table"><tbody>
          ${row('配置', (dk.configKB || 0) + ' KB')}
          ${row('用量记录', (dk.usageKB || 0) + ' KB')}
          ${row('群成员', (dk.membersKB || 0) + ' KB')}
          ${row('记忆目录', (dk.memoryMB || 0) + ' MB')}
        </tbody></table>`}
        <table class="table" style="margin-top:10px"><tbody>
          ${row('LLM 路由', (llm.provider || '(空)') + ' / ' + (llm.model || '(空)'), !llm.explicit)}
          ${llm.explicit ? '' : '<tr><td colspan="2" style="color:var(--warn)">⚠ 「聊天 provider/model」为空 —— DSH 路由缺失时会直接抛「无法确定 LLM 路由」，表现为完全不回话。去「人设模型」页选 provider / model（联动下拉）。</td></tr>'}
          ${row('视觉', (llm.visionProvider || '(同聊天)') + ' / ' + (llm.visionModel || '(未设)'))}
          ${row('上次实际路由', llm.lastRoute ? (llm.lastRoute.provider || '') + ' / ' + (llm.lastRoute.model || '') : '—')}
        </tbody></table>
      </div>

      <div class="section"><div class="hd">🔌 hook 进程状态</div>
        ${hk.error ? '<div class="empty">' + esc(hk.error) + '</div>' : `
        <table class="table"><tbody>
          ${row('IsLogin', String(hk.IsLogin), !hk.IsLogin)}
          ${row('模块基址', '0x' + Number(hk.base || 0).toString(16).toUpperCase())}
          ${row('模块大小', hk.module_size ? Math.round(hk.module_size/1048576) + ' MB' : '0（未取到）', !hk.module_size)}
          ${row('库数量', String(hk.dbs || 0), (hk.dbs || 0) === 0)}
          ${row('API 指针在模块内', String(hk.api_ptrs_in_module ?? '?'))}
        </tbody></table>`}
      </div>`;

    $('#diag-refresh').onclick = () => { App.diag = null; renderDiag(); };
    const clean = $('#diag-hires-clean');
    if (clean) clean.onclick = async () => {
      if (!confirm('清空 hires 目录里的缓存文件？（原图/整片视频，删了微信下次会重新下）')) return;
      try {
        await api('/action', { method: 'POST', body: JSON.stringify({ op: 'diagCleanHires' }) });
        toast('已清理', 'ok');
        App.diag = null; renderDiag();
      } catch (e) { toast('清理失败：' + e.message, 'err'); }
    };
  };

  // ── 轮询状态 + 恢复按钮 ─────────────────────────────────
  //  「库读得动」不等于「轮询在跑」：硬闸状态下探针照样成功，自检会全绿。
  //   所以这里直接把轮询器的真实状态摆出来，并给一个能真正重启轮询的按钮。
  const showPoll = (st) => {
    const el = $('#diag-poll-st');
    if (!el) return;
    if (!st || st.ok === false) { el.textContent = '取不到：' + ((st && st.error) || '桥未连接'); return; }
    const bits = [];
    if (st.hardStopped) bits.push('⛔ 硬闸');
    else if (st.stopped) bits.push('⛔ 已停止');
    else if (st.paused) bits.push('⏸ 暂停 ' + (st.pauseLeftSec || 0) + 's');
    else bits.push('✅ 运行中');
    bits.push('已查 ' + (st.polls || 0) + ' 轮 / 读到 ' + (st.msgs || 0) + ' 条 / ' + (st.tables || 0) + ' 表');
    if (st.consecFail) bits.push('连续失败 ' + st.consecFail);
    el.textContent = bits.join(' · ');
    el.style.color = (st.hardStopped || st.stopped) ? 'var(--warn)' : '';
    el.title = st.lastError || '';
  };
  api('/action', { method: 'POST', body: JSON.stringify({ op: 'pollStatus' }) })
    .then((j) => showPoll(j.result)).catch((e) => showPoll({ ok: false, error: e.message }));
  const pollBtn = $('#diag-poll');
  if (pollBtn) pollBtn.onclick = async () => {
    if (!confirm('解除轮询硬闸并重启轮询？')) return;
    pollBtn.disabled = true; pollBtn.textContent = '恢复中…';
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'pollResume' }) });
      showPoll(j.result);
      toast(j.result && j.result.restarted ? '轮询已重启' : '已解除硬闸', 'ok');
    } catch (e) { toast('恢复失败：' + e.message, 'err'); }
    finally { pollBtn.disabled = false; pollBtn.textContent = '恢复轮询'; }
  };

  // 微信客户端：状态 / 启动（不提供"关闭"——项目规矩 R1：绝不强杀微信）
  const wxSt = $('#diag-wx-st');
  const wxCall = async (action, label) => {
    if (!wxSt) return;
    wxSt.textContent = label + '…';
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'wechatPower', args: { action } }) });
      const r = j.result || {};
      let txt;
      if (action === 'status') {
        txt = '进程 ' + (r.count ?? r.processes ?? '?') + ' 个' + (r.running ? '（运行中）' : '（未运行）');
      } else {
        txt = r.ok ? '已启动' + (r.clicked ? '，已点进入微信' : '') : ('失败：' + (r.error || '未知'));
      }
      wxSt.textContent = txt;
      toast(txt, r.ok === false ? 'err' : 'ok');
    } catch (e) { wxSt.textContent = '失败：' + e.message; toast('微信操作失败：' + e.message, 'err') }
  };
  const wxStatusBtn = $('#diag-wx-status');
  if (wxStatusBtn) wxStatusBtn.onclick = () => wxCall('status', '查询中');
  const wxStartBtn = $('#diag-wx-start');
  if (wxStartBtn) wxStartBtn.onclick = async () => {
    if (!confirm('启动微信客户端，并自动点「进入微信」？\n\n（会等待登录确认，最长约 150 秒）')) return;
    await wxCall('start', '启动中');
  };

  const rlBtn = $('#diag-reload');
  if (rlBtn) rlBtn.onclick = async () => {
    if (!confirm('热重载插件代码？\n\n会重新加载 lib/index.js（约 1 秒不可用）；新代码加载失败会自动保留旧代。')) return;
    rlBtn.disabled = true; rlBtn.textContent = '重载中…';
    try {
      const j = await api('/action', { method: 'POST', body: JSON.stringify({ op: 'selfReload' }) });
      const r = j.result || {};
      if (r.ok) { toast('已触发热重载，1.5 秒后刷新页面', 'ok'); setTimeout(() => location.reload(), 1500); }
      else toast('重载失败：' + (r.error || '未知原因'), 'err');
    } catch (e) { toast('请求失败：' + e.message, 'err'); }
    finally { rlBtn.disabled = false; rlBtn.textContent = '热重载插件'; }
  };

  loadDiag(true).then(() => draw());
}

/* ── 手动操作 ─────────────────────────────────────────── */
function renderManual() {
  view.innerHTML = `<h2>手动操作</h2>
    <div class="section"><div class="hd">🕹 以机器人身份发一条</div>
      <div class="field"><div class="lab">操作</div><div class="ctl">
        <select id="op"><option value="sendText">发文字</option><option value="sayVoice">发语音（合成）</option>
          <option value="sendSticker">发表情包</option></select></div></div>
      <div class="field"><div class="lab">群</div><div class="ctl"><select id="op-room" style="min-width:240px"></select>
        <input id="op-room-manual" type="text" placeholder="或手输群名/roomId" style="flex:1;min-width:160px"></div></div>
      <div class="field"><div class="lab">内容</div><div class="ctl"><textarea id="op-text" placeholder="文字；发表情包时填 stickerId 或语境；拍一拍时填 wxid"></textarea></div></div>
      <div class="field" id="row-emotion" style="display:none"><div class="lab">音色</div><div class="ctl">
        <select id="op-emotion"><option>main</option><option>sweet</option><option>angry</option><option>serious</option></select></div></div>
      <div class="field" id="row-sticker" style="display:none"><div class="lab">附带表情包</div><div class="ctl">
        <label class="hswitch">发送后再补一张 <span class="sw"><input type="checkbox" id="op-sticker"><i></i></span></label></div></div>
      <div class="row"><button class="btn primary" id="btn-send">发送</button>
        <span class="muted small">发送会真的进群，先用小号群试。</span></div>
      <div id="op-result" class="small mono" style="margin-top:10px"></div></div>

    <div class="section"><div class="hd">🔎 查历史 / 最近消息</div>
      <div class="row"><input id="q" type="text" placeholder="关键词（搜微信历史）" style="flex:1;min-width:200px">
        <select id="q-room" style="min-width:200px"></select>
        <button class="btn" id="btn-search">搜索</button>
        <button class="btn" id="btn-history">看最近</button></div>
      <div id="q-result" class="small" style="margin-top:10px"></div></div>`;

  fillRoomSelect($('#op-room'), true);
  fillRoomSelect($('#q-room'), true);
  // 默认 op 就是 sendText，但行只在 onchange 里切 → 初始要同步一次
  syncOpRows();
  ensureBridgeRooms().then(() => { fillRoomSelect($('#op-room'), true); fillRoomSelect($('#q-room'), true); });
  const syncOpRows = () => {
    const op = $('#op').value;
    $('#row-emotion').style.display = op === 'sayVoice' ? '' : 'none';
    $('#row-sticker').style.display = op === 'sendText' ? '' : 'none';
  };
  $('#op').onchange = syncOpRows;
  $('#btn-send').onclick = async () => {
    const op = $('#op').value;
    const room = $('#op-room-manual').value.trim() || $('#op-room').value;
    const text = $('#op-text').value;
    if (room === '__manual') return toast('请在右侧手输群名/roomId', 'err');
    if (!text.trim()) return toast('内容不能为空', 'err');
    if (!confirm('确认以机器人身份发送到群？')) return;
    $('#btn-send').disabled = true;
    try {
      let args = { room, text };
      if (op === 'sendText') args.sticker = $('#op-sticker').checked;
      if (op === 'sayVoice') args.emotion = $('#op-emotion').value;
      if (op === 'sendSticker') { args = { room }; if (/^\w{6,}$/.test(text.trim()) && text.trim().length < 40) args.stickerId = text.trim(); else args.text = text.trim(); }
      if (op === 'pat') args = { room, wxid: text.trim() };
      const j = await api('/action', { method:'POST', body: JSON.stringify({ op, args }) });
      const r = j.result;
      $('#op-result').textContent = JSON.stringify(r, null, 1);
      const v = sendVerdict(op, r);
      if (v.ok) toast('已发送' + (r && r.mentions ? '（@ ' + r.mentions + ' 人）' : ''), 'ok');
      else toast('发送失败：' + v.why, 'err');
    } catch (e) { toast('失败：' + e.message, 'err'); $('#op-result').textContent = e.message; }
    finally { $('#btn-send').disabled = false; }
  };
  $('#btn-search').onclick = async () => {
    const room = roomFrom($('#q-room')), query = $('#q').value.trim();
    try {
      const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'searchMessages', args:{ room, query, limit: 30 } }) });
      const items = (j.result && j.result.items) || [];
      $('#q-result').innerHTML = items.length ? items.map(it => `<div style="padding:3px 0"><span class="muted small">${esc(fmtTime(it.ts))}</span> <b>${esc(it.senderName||it.sender||'')}</b> ${esc(it.text)}</div>`).join('') : '<div class="empty">没有结果</div>';
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#btn-history').onclick = async () => {
    const room = roomFrom($('#q-room'));
    try {
      const j = await api('/action', { method:'POST', body: JSON.stringify({ op:'history', args:{ room, limit: 30 } }) });
      const items = (j.result && (j.result.items || j.result)) || [];
      $('#q-result').innerHTML = Array.isArray(items) && items.length ? items.map(it => `<div style="padding:3px 0"><span class="muted small">${esc(fmtTime(it.ts))}</span> <b>${esc(it.isSelf?'我':(it.senderName||it.sender||''))}</b> ${esc(it.text)}</div>`).join('') : '<div class="empty">没有记录</div>';
    } catch (e) { toast(e.message, 'err'); }
  };
}

/* ── 启动 ─────────────────────────────────────────────── */
$('#m-enabled').onchange = async (e) => {
  const on = e.target.checked;
  if (!on && !confirm('停用机器人？\n\n停用后仍会收消息、记记忆，但不回复、不主动发言。')) { e.target.checked = true; return; }
  try {
    await api('/config', { method:'POST', body: JSON.stringify({ patch:{ enabled:on } }) });
    App.S.config.enabled = on; toast(on ? '机器人已启用' : '机器人已停用', on ? 'ok' : 'err'); renderHeader();
  } catch (err) { e.target.checked = !on; toast(err.message, 'err'); }
};
$('#m-dry').onchange = async (e) => {
  const on = e.target.checked;
  try {
    await api('/config', { method:'POST', body: JSON.stringify({ patch:{ dryRun:on } }) });
    App.S.config.dryRun = on; toast(on ? '演练模式：不发送' : '已退出演练模式', 'ok'); renderHeader();
  } catch (err) { e.target.checked = !on; toast(err.message, 'err'); }
};

renderNav();
refresh();
try { renderOpsBanner() } catch (e) { /* 横幅失败不影响面板 */ }
setInterval(() => refresh({ lite:true }), 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh({ lite:true }); });
</script>
</div>
</body>
</html>
